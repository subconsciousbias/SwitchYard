# ============================================================================
# SwitchYard — single source of truth for plans, models, capacity and lanes.
#
# THE MODEL, in two sentences. A **plan** is a thing you pay for: it owns the
# credentials, the quota windows, the connection limit, the monthly cost and the
# expiry date. A **model** is something a plan can serve; models carry no
# credentials of their own, and **lanes reference models, never plans**.
#
# Everything that is shared is therefore shared because it belongs to the plan:
# two models on one plan draw on the same connection limit, the same quota, the
# same cooldown and the same learned concurrency. That is not a special case —
# it is the point of the structure.
#
# A model may narrow its plan's connection limit with its own `max_parallel`
# (useful for a slow local model on a shared box), but never widen it.
#
# Lane members are written `plan/model`.
# ============================================================================

settings:
  # A plan expiring within this many days is promoted above plans you keep
  # paying for, soonest death first, so cancelled capacity gets drained.
  drain_within_days: 21
  # How long a session keeps its model. Refreshed on every request, so an
  # active session never migrates; an idle one lets its slot go.
  lease_ttl_seconds: 1800
  # How long a mid-tool-loop follow-up waits for a slot on its pinned plan
  # before spilling to a peer. Zero means spill immediately — the pin never
  # blocks. 10s rides out the moment when every slot of the pinned plan is
  # momentarily busy, so a running loop stays on the plan holding the
  # provider's prompt cache instead of bouncing a retry the caller then
  # re-fires anyway. The wait happens in the gateway with the request parked,
  # NOT on a slot: other sessions keep being placed while one waits. Cooled
  # plans and cap==0 plans are never waited on (they will not lift inside the
  # deadline).
  pin_wait_seconds: 10
  # Providers that wrap chain-of-thought in <think>...</think> leak it into
  # streamed content — LiteLLM lifts it into reasoning_content only for a
  # buffered reply. Set false to pass the tags through untouched.
  split_reasoning_tags: true
  # Per-model $/session column on the board (issue #76). Gates the cell
  # only — the underlying HLL is always written. Set false to hide the
  # column from the plans table.
  show_cost_per_session: true
  # A slot whose heartbeat has stopped for this long is assumed dead and pruned.
  # Slots are heartbeaten while their request is alive, so this can be short
  # without cutting off legitimately long calls — an OpenCode request runs for
  # minutes. Without heartbeats this had to exceed the longest possible request,
  # which meant a killed worker parked its slot for 15 minutes and a 2-slot plan
  # looked full with nothing running.
  inflight_max_age_seconds: 120
  heartbeat_seconds: 30
  # Default sit-out after a hard quota rejection, when the provider gives us
  # no Retry-After to go on.
  default_cooldown_seconds: 900
  # Slots the gateway keeps free for CLI-backed plans, so the gateway's slot
  # table and the sidecar's own gate stop racing on the same number. The
  # physical gate (the sidecar reads `max_parallel` from this same file) stays
  # at the configured value; the gateway's effective cap is reduced by this
  # many slots, so an ordinary claim/release race or a release the gateway
  # makes (client abort) while the sidecar CLI turn is still finishing no
  # longer produces a spurious 429. API plans are unaffected: their provider
  # rejects on its own, the learner backs off, and the headroom would just sit
  # unused. Floor at 1 in the application so a single-connection plan never
  # collapses to 0.
  gate_headroom_slots: 1

  # --------------------------------------------------------------------------
  # PER-CLI TOOL BLOCKLIST (issue #63). When the inbound request carries the
  # `x-switchyard-cli` header naming a CLI in this mapping, the gateway
  # filters those tool names (case-insensitive) out of the request's `tools`
  # array before the picker runs. The harness's native file/shell tools reach
  # the sidecar's container, not the caller's workspace, so a successful
  # "edit" call there silently does the wrong thing — worse than failing
  # loudly. Uncomment to override the in-code defaults below; absent, the
  # gateway uses the values shown.
  #
  # The header `x-switchyard-cli` is operator-set (same governance as
  # `x-switchyard-session`); no client sets it today, so the new behaviour
  # is inert until opted in. Keys are matched against the lowercased header
  # value — keep config keys lowercase.
  #
  # Defaults (kept in switchyard/models.py:_DEFAULT_CLI_TOOL_BLOCK):
  #
  #   cli_tool_block:
  #     opencode:
  #       - bash
  #       - edit
  #       - write
  #       - read
  #       - grep
  #       - glob
  #       - list
  #       - patch
  #       - todowrite
  #       - todoread
  #       - webfetch
  #       - websearch
  #       - task
  #       - multiedit
  #     claude-code:
  #       - Bash
  #       - Edit
  #       - Write
  #       - Read
  #       - Glob
  #       - Grep
  #       - WebFetch
  #       - WebSearch
  #       - NotebookEdit
  #     codex: []

  # --------------------------------------------------------------------------
  # Learn the parallelism each plan really tolerates instead of trusting a
  # guess. Halve on a connection-limit refusal, creep back up by one when there
  # is unmet demand and no recent refusal. Bucketed by hour of day, because a
  # provider that allows 6 connections at 04:00 may allow 2 at peak.
  # Learning is per PLAN, since the connection limit belongs to the plan.
  # --------------------------------------------------------------------------
  concurrency_learning:
    enabled: true
    buckets: hour_of_day        # hour_of_day | none
    seed_cap: 2                 # starting guess for `max_parallel: auto`
    min_cap: 1
    decrease_factor: 0.5
    increase_step: 1
    min_samples: 3
    probe_interval_seconds: 300
    probe_cooldown_seconds: 900
    probe_pressure: 3

  # --------------------------------------------------------------------------
  # PACING MODE — off by default. When on, subscriptions are throttled so each
  # lands at ~100% of its allowance right at rollover rather than burning out
  # early and spilling. Quota resets per window, so this is per-window burndown:
  # unused allowance is lost, never carried forward. A cancelled plan's final
  # window is truncated by its expiry, so it paces harder.
  #
  # While on, the tail is disabled and metered providers keep fixed caps.
  # Pacing is per PLAN, because the quota is the plan's.
  # --------------------------------------------------------------------------
  pacing:
    enabled: false
    min_slots: 1
    overshoot: 0.05             # aim 5% hot so we finish at 100%, not 95%
    disable_tail: true
    include_metered: false

  # --------------------------------------------------------------------------
  # TRANSIENT CIRCUIT BREAKER — the escalated-cooldown ladder for transient
  # upstream failures (5xx, timeout). One 5xx still sits the plan out for the
  # configured base (60s); each subsequent 5xx in a row doubles the sit-out
  # (120, 240, 480, …) capped at `max_seconds`. The streak is reset by the
  # first successful call against the plan, so recovery is automatic. The
  # board shows a 'failing · Nx' chip on the plan's row once the streak
  # reaches `streak_alert`. Disable only if you want the legacy flat cooldown.
  # --------------------------------------------------------------------------
  transient_breaker:
    enabled: true
    max_seconds: 1800          # half an hour; enough to outlast most blips
    streak_alert: 3            # when the board starts surfacing the failing chip

  # --------------------------------------------------------------------------
  # CALLER ENVIRONMENT — the caller's tool-execution environment, resolved
  # per request (issue #44). The inner CLI runs in a SwitchYard relay
  # container; the caller's tools run on the caller's machine. Without a
  # signal, the inner CLI's own `# Environment` block — Linux, /app/mcp_bridge
  # — wins the model's attention, and the model answers a Windows user with
  # "I am on Linux in /app/mcp_bridge". This block decides what to tell the
  # inner CLI in its place.
  #
  # A single SwitchYard instance can serve Windows, macOS and Linux callers
  # at once, so resolution is per-request, not per-deployment. Each plan's
  # connection limit and quota still belong to the plan; this is only about
  # what to write into the inner CLI's prompt.
  #
  # Precedence (see switchyard/caller_env.py for the full contract):
  #
  #   1. config forced `platform` / `cwd` / `shell`   -> source=config
  #   2. environment parsed from the request body      -> source=request
  #   3. synthetic probe (mcp_bridge tool round-trip)  -> source=probe
  #   4. `fallback_platform` (PLATFORM ONLY)          -> source=host
  #   5. otherwise                                     -> source=unknown
  #
  # The relay's environment is NEVER a fallback. The Docker host's working
  # directory has no reliable relationship to the directory a caller later
  # opens in Claude Code or OpenCode, so cwd is also never inferred from the
  # host. Only platform is — and only as a last resort.
  #
  # `probe: auto` lets the mcp_bridge mint a single read-only synthetic
  # command tool call on the very first request of a new session when no
  # environment has been resolved yet. The probe runs once, cannot retry,
  # and never enumerates environment variables (it only runs `pwd`,
  # `uname -s` and prints `$SHELL`). Use `disabled` to skip the probe, or
  # `required` to refuse requests that have neither a passive environment
  # nor a forced override.
  # --------------------------------------------------------------------------
  caller_environment:
    probe: auto               # auto | disabled | required
    # Forced values, when set, beat everything else — passive detection and
    # probing are both skipped. Useful for a kiosk with a single fixed
    # caller, or for testing the env-block rendering without a real caller.
    # platform: windows
    # cwd: C:\Users\demo\project
    # shell: powershell
    # Last-resort platform hint when nothing else gave us one. Never a cwd:
    # the directory `docker compose up` was launched from has no reliable
    # relationship to the directory a caller opens in their editor an hour
    # later. Use `macos` if the deployment is known to run on macOS hardware
    # and a Windows / Linux caller will be detected passively anyway; leave
    # it unset for a Linux container serving mixed callers.
    # fallback_platform: macos

# ============================================================================
# PLANS — what you pay for. Credentials, quota, connection limit, cost, expiry.
# ============================================================================
plans:

  # ---------------------------------------------------------- workhorses ----
  minimax-ultra:
    label: "Minimax Ultra Token Plan"
    auth: api_key
    provider_family: minimax
    monthly_cost: 20
    max_parallel: 4               # starting point; the learner adjusts
    max_parallel_ceiling: 6
    api_base: os.environ/MINIMAX_ULTRA_API_BASE
    api_key: os.environ/MINIMAX_ULTRA_API_KEY
    # Two windows: a weekly allowance to fill, and a 5-hour burst cap not to
    # overshoot. No monthly pool — spend at the slowest rate either allows.
    quotas:
      - name: 5h
        role: constraint
        kind: tokens
        period: rolling_5h
        allowance: null           # TODO: observe the burst ceiling
        source: estimate
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null           # TODO, or let the probe report it
        source: probe
    probe:
      # The console's own headroom route, captured from a live session at
      # platform.minimax.io/console/usage. It only answers a browser session —
      # an API key gets "cookie is missing (1004)" — so paste the cookie in the
      # portal. An earlier guess at api.minimax.io/v1/coding_plan/remains was
      # wrong on both host and path.
      kind: cookie
      url: https://platform.minimax.io/backend/account/token_plan/remains_percent
      method: GET
      window: weekly                # which window the flat numbers describe
      interval_seconds: 120
      referer: https://platform.minimax.io/console/usage
      # It reports PERCENTAGES and nothing else: every *_count field comes back
      # -1, so used_percent is the only real measurement. One response carries
      # both windows — `current_interval_*` is the 5-hour window (end_time minus
      # start_time is 18000s) and `current_weekly_*` the weekly one — and entries
      # are per model family, so the path selects `general` by name rather than
      # trusting the array's order:
      #   {"model_remains":[{"model_name":"general",
      #      "end_time":1789966800000,"current_interval_used_percent":"0%",
      #      "weekly_end_time":1790553600000,"current_weekly_used_percent":"0%",
      #      "current_weekly_used_count":-1},{"model_name":"video",...}]}
      windows:
        weekly:
          used_percent: [model_remains.model_name=general.current_weekly_used_percent]
          reset_at: [model_remains.model_name=general.weekly_end_time]
        5h:
          used_percent: [model_remains.model_name=general.current_interval_used_percent]
          reset_at: [model_remains.model_name=general.end_time]
    notes: "Good at coding when the instructions are explicit."
    models:
      m3:
        # NB: `minimax-m3-highspeed` does not exist. The catalogue offers
        # MiniMax-M3 plus highspeed builds of M2.1 / M2.5 / M2.7, so this is the
        # plain M3.
        model: openai/MiniMax-M3
      m2.7-highspeed:
        # Cheaper and less capable. Deliberately in no lane — reachable only by
        # naming it directly.
        model: openai/MiniMax-M2.7-highspeed

  minimax-max:
    label: "Minimax Max Token Plan"
    auth: api_key
    provider_family: minimax
    monthly_cost: 20
    max_parallel: 4
    max_parallel_ceiling: 6
    api_base: os.environ/MINIMAX_MAX_API_BASE
    api_key: os.environ/MINIMAX_MAX_API_KEY
    # Two windows: a weekly allowance to fill, and a 5-hour burst cap not to
    # overshoot. No monthly pool — spend at the slowest rate either allows.
    quotas:
      - name: 5h
        role: constraint
        kind: tokens
        period: rolling_5h
        allowance: null           # TODO: observe the burst ceiling
        source: estimate
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null           # TODO, or let the probe report it
        source: probe
    probe:
      # Same route as minimax-ultra: one console, one cookie, but a separate
      # plan with its own meters, so it gets its own probe and its own reading.
      kind: cookie
      url: https://platform.minimax.io/backend/account/token_plan/remains_percent
      method: GET
      window: weekly                # which window the flat numbers describe
      interval_seconds: 120
      referer: https://platform.minimax.io/console/usage
      # It reports PERCENTAGES and nothing else: every *_count field comes back
      # -1, so used_percent is the only real measurement. One response carries
      # both windows — `current_interval_*` is the 5-hour window (end_time minus
      # start_time is 18000s) and `current_weekly_*` the weekly one — and entries
      # are per model family, so the path selects `general` by name rather than
      # trusting the array's order:
      #   {"model_remains":[{"model_name":"general",
      #      "end_time":1789966800000,"current_interval_used_percent":"0%",
      #      "weekly_end_time":1790553600000,"current_weekly_used_percent":"0%",
      #      "current_weekly_used_count":-1},{"model_name":"video",...}]}
      windows:
        weekly:
          used_percent: [model_remains.model_name=general.current_weekly_used_percent]
          reset_at: [model_remains.model_name=general.weekly_end_time]
        5h:
          used_percent: [model_remains.model_name=general.current_interval_used_percent]
          reset_at: [model_remains.model_name=general.end_time]
    notes: "A second plan on the same provider, for more parallel capacity."
    models:
      m3:
        model: openai/MiniMax-M3
      m2.7-highspeed:
        # Direct-only, as above.
        model: openai/MiniMax-M2.7-highspeed

  glm:
    label: "GLM Coding Plan (Z.AI)"
    auth: api_key
    provider_family: zai
    monthly_cost: 10
    max_parallel: 2
    expires: null            # set a date to have the drain rule prefer it
    # A Coding Plan key works ONLY on the coding endpoint. Verified by direct
    # call: coding returns 200, while api.z.ai/api/paas/v4 and
    # open.bigmodel.cn/api/paas/v4 both return 429 code 1113 "insufficient
    # balance". A wrong base URL therefore looks exactly like an exhausted plan
    # — check the URL before believing a GLM quota error.
    api_base: os.environ/GLM_API_BASE
    api_key: os.environ/GLM_API_KEY
    quotas:
      - name: 5h
        role: constraint          # Z.AI enforces a 5-hour prompt window
        kind: tokens
        period: rolling_5h
        allowance: null           # TODO: confirm on the Z.AI plan page
        source: probe
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null           # TODO: confirm; may be monthly instead
        source: probe
    notes: "Metered. The tail exists so a lane never silently falls back to this."
    probe:
      # z.ai publishes the Coding Plan's own quota here. The key goes in
      # Authorization RAW — a `Bearer ` prefix is rejected — which is why this
      # is a header mapping rather than probe kind `bearer`.
      #
      #   {"data":{"level":"pro","limits":[
      #     {"type":"TIME_LIMIT","unit":5,"number":1,"usage":1000,
      #      "remaining":1000,"percentage":0,"nextResetTime":...},
      #     {"type":"TOKENS_LIMIT","unit":3,"number":5,"percentage":0},
      #     {"type":"TOKENS_LIMIT","unit":6,"number":1,"percentage":1,
      #      "nextResetTime":1790542882984}]}}
      #
      # Two TOKENS_LIMIT rows differ only by `unit` — 3 carries `number: 5` for
      # the 5-hour window, 6 carries `number: 1` for the weekly one — so both
      # fields are matched. Matching on type alone would read whichever came
      # first in the array.
      kind: none
      url: https://api.z.ai/api/monitor/usage/quota/limit
      method: GET
      window: weekly
      interval_seconds: 120
      headers:
        Authorization: os.environ/GLM_API_KEY
      windows:
        5h:
          used_percent: [data.limits.type=TOKENS_LIMIT&unit=3.percentage]
          reset_at: [data.limits.type=TOKENS_LIMIT&unit=3.nextResetTime]
        weekly:
          used_percent: [data.limits.type=TOKENS_LIMIT&unit=6.percentage]
          reset_at: [data.limits.type=TOKENS_LIMIT&unit=6.nextResetTime]

    models:
      glm-5.3:
        # Judgement-regular tier. Ids confirmed against the coding endpoint's
        # catalogue: glm-4.5 … glm-5.3, glm-5.3-flash, glm-5.3-flashx.
        model: openai/glm-5.3
        max_parallel: 2
      glm-5.3-flash:
        # Workhorse tier.
        model: openai/glm-5.3-flash
        max_parallel: 2

  openrouter:
    label: "OpenRouter"
    auth: api_key
    monthly_cost: 0
    metered: true                 # pay-per-token, not a subscription
    max_parallel: 4
    api_key: os.environ/OPENROUTER_API_KEY
    quotas:
      - name: monthly
        role: target
        kind: dollars
        period: month
        allowance: 50             # hard ceiling; alerts at 80%
        source: ledger
    alert_burn_rate_per_hour: 5   # the $20/hr surprise must page us early
    notes: >
      Model-agnostic and the only non-subscription plan. Add models freely —
      they all share the one dollar budget and the one connection limit.
    models:
      mimo:
        # Slug confirmed against OpenRouter's catalogue (mimo-v2.5, not 2.5;
        # xiaomi/mimo-v2.5-pro also exists).
        model: openrouter/xiaomi/mimo-v2.5
        max_parallel: 2

  opencode-go:
    label: "OpenCode Go Plan"
    # Reached through the OpenCode CLI's own login — a credential the CLI holds,
    # so no API key here. Its own sidecar process because its quota is separate
    # from the Grok plan's, even though both use the same CLI.
    auth: cli_sidecar
    monthly_cost: 10
    max_parallel: 2
    expires: null            # set a date to have the drain rule prefer it
    api_base: http://opencode-go-sidecar:8084/v1
    api_key: sidecar
    # The quotas are `source: probe`, and that was checked rather than assumed.
    # The console at opencode.ai/console does have a usage API —
    # `GET /console/api/usage/summary?range=7d` with an `x-org-id: wrk_...`
    # header and the session cookie answers with real totals — but it is the Zen
    # pay-as-you-go surface (requests, tokens, totalCostMicroCents) and reports
    # zero for this plan: Go subscription traffic is not metered there. Its
    # bundle references no plan, quota or limits route at all (only /api/usage,
    # /api/billing, /api/budgets and config), and opencode's own CLI binary
    # carries none either — the `billing` strings in it are bundled GitHub API
    # surface. Upstream issue #16017 asks for exactly this endpoint and is still
    # open.
    #
    # A probe against that summary route would therefore show a permanent 0,
    # which reads as verified headroom and is worse than admitting there is no
    # number. The go/status route below is the real source; SwitchYard's own
    # tally from response token counts stays a labelled floor on consumption.
    # Three windows, all in DOLLARS of model spend, not tokens: the Go plan is
    # $10/month that buys metered model usage, and the console meters it as
    # microcents against a limit. Monthly is the allowance worth filling; the
    # weekly and 5-hour meters are caps not to overshoot. Every number here comes
    # from the probe below, which reports all three from one response.
    quotas:
      - name: 5h
        role: constraint
        kind: dollars
        period: rolling_5h
        allowance: 12.0           # limitMicroCents 1200000000
        source: probe
      - name: weekly
        role: constraint
        kind: dollars
        period: week
        allowance: 30.0           # limitMicroCents 3000000000
        source: probe
      - name: monthly
        role: target
        kind: dollars
        period: month
        allowance: 60.0           # limitMicroCents 6000000000
        source: probe
    probe:
      # The Go plan's own status route, read from the console page at
      # /console/<org>/go. Verified against a live session: it answers with all
      # three meters at once, as usedMicroCents against limitMicroCents.
      #   {"access":{"endsAt":"...","meters":{
      #      "fiveHour":{"resetsAt":"...","limitMicroCents":"1200000000",
      #                  "usedMicroCents":"383625"},
      #      "week":{...},"month":{...}}}}
      # `used` is what it publishes, so the prober derives remaining = limit-used.
      kind: cookie
      # Opt-in sliding capture of the session cookie. When true, a verified-good
      # probe response (2xx, no reauth marker, Set-Cookie present) overwrites
      # the stored credential so the portal never has to ask you to paste a
      # fresh one. Only fire this after confirming in the browser devtools that
      # THIS endpoint actually returns a new Set-Cookie on each successful
      # request — a 401/reauth body with a Set-Cookie still does NOT overwrite,
      # but a route that does not slide will just stay on its current cookie.
      # capture_set_cookie: true
      url: https://opencode.ai/console/api/go/status
      method: GET
      window: monthly
      interval_seconds: 120
      referer: https://opencode.ai/console
      headers:
        # Required: the route answers {"code":"org_required"} without it. Not a
        # credential, but account-identifying, so it lives in .env rather than
        # in this committed file.
        x-org-id: os.environ/OPENCODE_ORG_ID
      # microcents -> dollars.
      scale: 0.00000001
      windows:
        5h:
          used: [access.meters.fiveHour.usedMicroCents]
          total: [access.meters.fiveHour.limitMicroCents]
          reset_at: [access.meters.fiveHour.resetsAt]
        weekly:
          used: [access.meters.week.usedMicroCents]
          total: [access.meters.week.limitMicroCents]
          reset_at: [access.meters.week.resetsAt]
        monthly:
          used: [access.meters.month.usedMicroCents]
          total: [access.meters.month.limitMicroCents]
          # The month meter publishes no resetsAt; the subscription's own end
          # date is the next boundary that matters for a cancelled plan.
          reset_at: [access.endsAt]
    notes: >
      A short-lived plan. Give it an `expires:` date and the drain rule
      moves it to the front of its lane as that date approaches. All three
      meters are probed from the console route above.
    models:
      # provider/model as OpenCode names it — `opencode` and `opencode-go` are
      # DIFFERENT providers there (free/community versus this paid plan).
      glm-5.3-flash:
        model: openai/opencode-go/glm-5.3-flash
        max_parallel: 1

  # A SECOND subscription on the same CLI product is a SECOND sidecar process,
  # not a second plan on the first plan's api_base: a sidecar serves exactly one
  # plan (SWITCHYARD_PLAN) with exactly one CLI login, so sharing a process
  # would spend the first account's quota under the second plan's name. Copy the
  # compose service, bump the port, and give each plan its own org id in .env.
  opencode-go2:
    label: "OpenCode Go Plan #2"
    auth: cli_sidecar
    monthly_cost: 10
    max_parallel: 2
    expires: null            # set a date to have the drain rule prefer it
    api_base: http://opencode-go2-sidecar:8085/v1
    api_key: sidecar
    # Same three DOLLAR windows as the first Go plan — see that block for how
    # the allowances were derived and why the Zen summary route is a decoy.
    quotas:
      - name: 5h
        role: constraint
        kind: dollars
        period: rolling_5h
        allowance: 12.0           # limitMicroCents 1200000000
        source: probe
      - name: weekly
        role: constraint
        kind: dollars
        period: week
        allowance: 30.0           # limitMicroCents 3000000000
        source: probe
      - name: monthly
        role: target
        kind: dollars
        period: month
        allowance: 60.0           # limitMicroCents 6000000000
        source: probe
    probe:
      kind: cookie
      url: https://opencode.ai/console/api/go/status
      method: GET
      window: monthly
      interval_seconds: 120
      referer: https://opencode.ai/console
      headers:
        # One org id per Go subscription — OPENCODE_ORG_ID2 for this plan.
        x-org-id: os.environ/OPENCODE_ORG_ID2
      scale: 0.00000001
      windows:
        5h:
          used: [access.meters.fiveHour.usedMicroCents]
          total: [access.meters.fiveHour.limitMicroCents]
          reset_at: [access.meters.fiveHour.resetsAt]
        weekly:
          used: [access.meters.week.usedMicroCents]
          total: [access.meters.week.limitMicroCents]
          reset_at: [access.meters.week.resetsAt]
        monthly:
          used: [access.meters.month.usedMicroCents]
          total: [access.meters.month.limitMicroCents]
          reset_at: [access.endsAt]
    notes: >
      Second Go subscription: own sidecar process, own CLI login, own org id.
    models:
      glm-5.3-flash:
        model: openai/opencode-go/glm-5.3-flash
        max_parallel: 1

  # ------------------------------------------------------------ judgement ----
  claude-max:
    label: "Claude Max $200"
    auth: cli_sidecar             # OAuth; the Claude CLI holds the credential
    monthly_cost: 100
    max_parallel: 2
    max_parallel_ceiling: 2       # never probe above it
    api_base: http://claude-max-sidecar:8081/v1
    api_key: sidecar
    # Sessions parked awaiting a caller's tool result. They run no inference and
    # hold no connection slot, but each is a live CLI process, so they are
    # capped separately. Omit for the default of twice max_parallel.
    # max_parked_sessions: 4
    quotas:
      - name: 5h
        role: constraint          # do not blow the burst window
        kind: tokens
        period: rolling_5h
        allowance: null           # percent only; see the probe below
        source: probe
      - name: weekly
        role: target              # this is the allowance worth filling
        kind: tokens
        period: week
        allowance: null           # percent only; see the probe below
        source: probe
    probe:
      # Not a console endpoint: the sidecar runs the CLI's own `/usage` and
      # returns the report it wrote to its transcript. Anthropic does publish
      # this at api.anthropic.com/api/oauth/usage, but reaching it from here
      # would mean using the subscription's OAuth token directly, which its
      # terms do not allow — so the vendor's own client is asked instead.
      #
      #   {"rate_limits":{"limits":[
      #      {"kind":"session","percent":2,"resets_at":"2026-09-21T09:10:00+00:00"},
      #      {"kind":"weekly_all","percent":98,"resets_at":"2026-09-23T03:00:00+00:00",
      #       "severity":"critical"},
      #      {"kind":"weekly_scoped","percent":12,"scope":{"model":{...}}}]}}
      #
      # `weekly_scoped` is deliberately not mapped: it is one model's share of
      # the same week, so showing it as the weekly window would understate what
      # is left. `weekly_all` is the one that stops you.
      kind: none              # no cookie: the sidecar holds the credential
      url: http://claude-max-sidecar:8081/usage
      method: GET
      window: weekly
      interval_seconds: 900
      timeout_seconds: 180    # it shells out to the CLI
      windows:
        5h:
          used_percent: [rate_limits.limits.kind=session.percent]
          reset_at: [rate_limits.limits.kind=session.resets_at]
        weekly:
          used_percent: [rate_limits.limits.kind=weekly_all.percent]
          reset_at: [rate_limits.limits.kind=weekly_all.resets_at]
    notes: >
      Critical logic only. All three models share the plan's 2 connections and
      its quota windows, so apex and judge can never exceed them between them.
    models:
      opus:
        model: openai/claude-opus-5
        max_parallel: 2
      fable:
        # Fable 5.1 as served by the subscription, not the metered API.
        model: openai/claude-fable-5-1
        max_parallel: 1
      sonnet:
        # Direct-only: in no lane, so Claude quota stays reserved for the
        # judgement lanes unless you ask for this model by name.
        model: openai/claude-sonnet-5
        max_parallel: 2

  openai:
    label: "OpenAI $100 Plan (ChatGPT seat)"
    # A seat has no API key: the Codex CLI owns the OAuth login.
    auth: cli_sidecar
    provider_family: openai
    monthly_cost: 30
    max_parallel: 2
    max_parallel_ceiling: 2       # the seat allows 2; do not probe past it
    expires: null            # set a date to have the drain rule prefer it
    api_base: http://codex-sidecar:8082/v1
    api_key: sidecar
    # One window only: the seat meters weekly, with no 5-hour burst cap.
    quotas:
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null           # percent only; see the probe below
        source: probe
    probe:
      # Codex records its own rate limits in every session rollout, so the
      # sidecar reads them from disk — no call to
      # chatgpt.com/backend-api/codex/usage, which would mean using the seat's
      # OAuth token directly. It is therefore as fresh as the last request this
      # plan served; `resets_at` says which window it describes.
      #
      #   {"rate_limits":{"limit_id":"codex","plan_type":"prolite",
      #     "primary":{"used_percent":100.0,"window_minutes":10080,
      #                "resets_at":1790051828},
      #     "secondary":null,
      #     "credits":{"has_credits":true,"balance":"218.70"}}}
      #
      # window_minutes 10080 is seven days, which is the weekly window here.
      kind: none
      url: http://codex-sidecar:8082/usage
      method: GET
      window: weekly
      interval_seconds: 120
      windows:
        weekly:
          used_percent: [rate_limits.primary.used_percent]
          reset_at: [rate_limits.primary.resets_at]
    notes: "Every model on this seat shares its 2 connections and its quota."
    models:
      # Verified ids on a ChatGPT seat, in capability order — sol strongest, then
      # terra, luna weakest. Prompt overhead for a 5-token reply in brackets.
      # Note the scheme: gpt-5, gpt-5-codex and codex-1 are all rejected.
      sol:
        model: openai/gpt-5.6-sol        # [13293] strongest of the 5.6 family
        max_parallel: 1
      terra:
        model: openai/gpt-5.6-terra      # [13293] direct-only
        max_parallel: 1
      luna:
        model: openai/gpt-5.6-luna       # [11728] weakest; direct-only
        max_parallel: 2
      astra:
        model: openai/gpt-6-astra        # [14154] "Astra 6", the apex tier
        max_parallel: 1

  grok:
    label: "Grok $300 Plan (SuperGrok)"
    # OAuth-only, and reached through SwitchYard's OWN grant rather than the
    # OpenCode CLI: api.x.ai is OpenAI-compatible, so the token proxy forwards
    # the caller's body untouched and tool calling survives the trip. Rides the
    # subscription, on a quota entirely separate from metered api.x.ai credits.
    # `oauth_proxy`, not `cli_sidecar`: there is no CLI in this path at all.
    auth: oauth_proxy
    provider_family: xai
    monthly_cost: 30
    max_parallel: 2
    max_parallel_ceiling: 4
    expires: null            # set a date to have the drain rule prefer it
    api_base: http://xai-token-proxy:8090/v1
    api_key: sidecar
    # One window only: SuperGrok meters a weekly allowance, with no 5-hour
    # burst cap and no separate monthly pool.
    quotas:
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null           # percent only; see the probe below
        source: probe
        # NOT wired to x-ratelimit-*, though api.x.ai does send them. Measured:
        # three calls consuming ~3,000 tokens left x-ratelimit-remaining-tokens
        # at exactly 53,000,000 and remaining-requests at 8,300 — they are the
        # advertised ceiling, not live headroom, so mapping them would put a
        # number on the board that never moves and reads as "plenty left".
        #
        # There is no machine-readable alternative: /v1/usage, /v1/subscription,
        # /v1/rate-limits and /v1/quota are all 404, and console.x.ai covers the
        # metered API credits (balance $0.00) rather than this subscription. So
        # this plan is ledger-estimated until xAI publishes something real.
        # The proxy still forwards those headers — retry-after among them — and
        # a `headers:` mapping here is all it would take if they ever go live.
    probe:
      # What the Grok CLI itself reads: the billing endpoint on its chat proxy,
      # with the same bearer. The token proxy fetches it, so no credential
      # reaches the portal. `creditUsagePercent` is the subscription's weekly
      # figure — 100.0 while the x-ratelimit headers still claimed 53,000,000
      # tokens remaining, which is exactly why those are not used.
      kind: none
      url: http://xai-token-proxy:8090/usage
      method: GET
      window: weekly
      interval_seconds: 120
      windows:
        weekly:
          used_percent: [config.creditUsagePercent,
                         config.productUsage.product=GrokBuild.usagePercent]
          reset_at: [config.currentPeriod.end, config.billingPeriodEnd]
    notes: "One weekly pool, shared across every surface the subscription covers."
    # Once xAI reports the weekly pool at 100%, further requests bill the
    # prepaid credit balance rather than the subscription. Left false, so the
    # plan drops out of its lane until the window resets — set it true to burn
    # that balance down deliberately.
    use_extra_quota: false

    models:
      grok-4.6:
        # Plain `grok-4.6`, not `xai/grok-4.6`: the provider prefix was how the
        # OpenCode CLI named it, and api.x.ai itself rejects it as not-found.
        # (Only the leading `openai/` is a LiteLLM provider hint and is stripped.)
        model: openai/grok-4.6
        max_parallel: 2

  # ---------------------------------------------------------------- local ----
  local-box:
    label: "Local models (this machine)"
    auth: api_key                 # local, but the server still wants a key
    monthly_cost: 0
    # ONE machine, so one connection limit however many models point at it.
    # Three models at 2 each would put six concurrent requests on hardware that
    # handles one or two.
    max_parallel: 2
    # No concurrency learning here: a local server queues requests rather than
    # refusing them, so the learner never sees pressure, reads that as headroom
    # and keeps probing upward — while the real effect is a longer queue and
    # worse latency on hardware that handles one or two at a time. 2 means 2.
    learning: false
    api_base: os.environ/LOCAL_API_BASE
    api_key: os.environ/LOCAL_API_KEY
    quotas:
      - name: unlimited
        role: target
        kind: unlimited
        source: none
    notes: "Unmetered. Slow under load — keep parallelism low."
    models:
      qwen:
        label: "Qwen 3.8 Flash Next"
        model: openai/Qwen3.8-Flash-Next-oQ4e-mtp
        context_window: 262144
        max_parallel: 1
      gemma:
        label: "Gemma 4 26B"
        model: openai/gemma-4-26B-A4B-it-oQ4e-mtp
        context_window: 262144
        max_parallel: 1
      # The local GLM 5.3 Flash build is deliberately absent while you are still
      # testing it. Adding it back would also restore a 1M-context member, which
      # is the only thing context-window fallbacks currently have to aim at.

# ============================================================================
# LANES — ordered capacity, written as `plan/model`. Requests fill each model's
# plan to its connection limit, then spill to the next.
#
# `tail` is last-resort capacity: it keeps a lane from hard-failing but never
# carries normal traffic, and is excluded from the lane's advertised slots.
#
# A TAIL MUST BE LOCAL. Its whole job is to still be there when the paid capacity
# has run out, so a subscription in the tail defeats the purpose — that is exactly
# what will be exhausted at the moment the tail is needed. OpenRouter would work
# too (it fails on money, not quota) but is deliberately not used for this.
#
# `strategy` controls how a lane orders its body. Five strategies are available;
# each lane's body is a list of entries, and each entry is EITHER a bare
# `plan/model` ref OR a single-key mapping `{strategy_name: body}`. Groups nest
# recursively up to depth 4 -- the picker recurses through the outer strategy,
# then the inner one, producing a single visit order per new session. Ordinary
# spill-and-fill runs THROUGH that visit order, so gating, affinity and the
# per-member caps keep working unchanged.
#
#   fill (default)        -- config order, pure spill-and-fill. The picker never
#                             reads or writes a Redis key. Flat configs parse
#                             bit-for-bit identically with this strategy.
#   round_robin           -- visit the group's members in turn, one per new
#                             session. `round_robin: [a, b]` puts a and b in
#                             strict alternation.
#   weighted              -- visit by `{ref: weight}` ratio. Weights are
#                             integers; `weighted: {a: 5, b: 2}` visits a five
#                             times for every two visits to b.
#   lowest_utilization    -- visit the member with the lowest current load
#                             first. Like `perishable` without the hours-to-
#                             reset signal, so useful when probes are absent
#                             or unreliable.
#   perishable            -- headroom-aware ordering. The portal re-ranks each
#                             member after every successful probe and writes
#                             the visit order to `sy:group-order:{gid}`; the
#                             picker reads that key on each new session. Built
#                             for lanes that mix weekly subscriptions whose
#                             budget is racing the reset -- drain the emptiest
#                             hour-per-dollar first, do not waste capacity on
#                             a 90%-used plan when a 10%-used one has the
#                             same reset.
#
# Per-member score (TARGET window only; weekly, monthly, whatever the plan's
# target is):
#
#     room     = 100 - reported_pct_used            # % of the allowance left
#     hours    = max(1.0, (reset_at - now) / 3600)  # clamp so a near-now reset
#                                                  # doesn't blow up the ratio
#     score    = room / hours                       # higher -> drain sooner
#
# A member with no usable facts (no probe yet, fresh credential, etc.) gets
# no score and lands after every scored member, in config order. Tails never
# score -- they stay at the end regardless.
#
# The 5-hour constraint window is a gate, not a rank: pct_used > 90 flips
# `gate5h_<ref>` on, and the picker skips that member for NEW sessions --
# affinity and a pinned follow-up stay untouched (they already returned), so
# any session whose plan is in the middle of a burst finishes where it
# started. Score does not incorporate the gate signal -- the gate is binary,
# and conflating it with the rank would make a 50%-member whose 5h is at
# 95% jump ahead of a 80%-member whose 5h is at 30% for the wrong reason.
#
# Hysteresis lives on the WRITER, not the rank. Each poll computes the desired
# order as score-desc; the stored order is then allowed one adjacent swap
# where the lower-position member beats the one ahead by ratio >= ~1.2. That
# keeps a 51/49 flip from flipping the lane, while still draining a real 90/30
# gap. Members with no usable facts sort last; lanes with no facts at all
# keep their stored order (the picker will fall back to config order on
# staleness automatically).
#
# Staleness bound is roughly 2x the probe interval (writer-decided). One
# missed poll doesn't tear down a working ranking; a quiet probe pulls the
# lane back to config order instead of serving a stale one for hours.
# ============================================================================
lanes:

  apex:
    label: "Judgement — Heavy"
    description: >
      Escalations where Opus-class judgement was not enough. Note that both
      members ride plans whose other models serve `judge`, so the connection
      limits are shared — by design.
    # strategy: perishable
    order: [claude-max/fable, openai/astra]
    tail: [local-box/qwen]

  judge:
    label: "Judgement — Regular"
    description: "The normal judgement tier. Most judgement tasks land here."
    # strategy: perishable
    order: [claude-max/opus, openai/sol, glm/glm-5.3]
    tail: [local-box/qwen]

  forge:
    label: "Coding Workhorse"
    description: "Getting work done. Ordered fill across every workhorse plan."
    # Demonstrates the strategy catalogue. The first three slots are groups on
    # the twin Minimax seats -- each strategy produces a different visit order
    # over the same two plans. The bare refs at the end need no group: one
    # plan, one slot. The tail stays last under every strategy.
    order:
      # round_robin on the twins: alternate Minimax Ultra / Minimax Max per session.
      - round_robin: [minimax-ultra/m3, minimax-max/m3]
      # weighted over the same twins: visit Ultra five times for every two of Max.
      - weighted: {minimax-ultra/m3: 5, minimax-max/m3: 2}
      # perishable over the twins: drain the emptiest hour-per-dollar twin first.
      - perishable: [minimax-ultra/m3, minimax-max/m3]
      # Single-plan members do not need a group; the picker visits them directly.
      - grok/grok-4.6
      - opencode-go/glm-5.3-flash
      - openrouter/mimo
    tail: [local-box/qwen]

  nest-demo:
    label: "Strategy Nesting (demo)"
    description: >
      Outer `round_robin` alternates between two inner `lowest_utilization`
      groups; each inner group picks the lighter-loaded member of its pair.
      Groups nest recursively up to depth 4.
    order:
      - round_robin:
          # Inner group A: prefer whichever Claude / OpenAI heavy model is freer.
          - lowest_utilization: [claude-max/opus, openai/sol]
          # Inner group B: same idea for the judgement-heavy tier.
          - lowest_utilization: [claude-max/fable, openai/astra]
    tail: [local-box/qwen]

  local:
    label: "Local Only"
    # No tail and no cloud members on purpose: if the box is busy the caller
    # gets a 429 and backs off rather than silently spending money.
    order: [local-box/qwen, local-box/gemma]
    tail: []

  bulk:
    label: "Basic"
    description: "Mechanical work — summaries, extraction, commit messages."
    order: [local-box/gemma, local-box/qwen]
    # Already all local, so a tail would add nothing.
    tail: []
