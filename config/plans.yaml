# ============================================================================
# Switchyard — single source of truth for plans, models, capacity and lanes.
#
# THE MODEL, in two sentences. A **plan** is a thing you pay for: it owns the
# credentials, the quota windows, the connection limit, the monthly cost and the
# expiry date. A **model** is something a plan can serve; models carry no
# credentials of their own, and **lanes reference models, never plans**.
#
# Everything that is shared is therefore shared because it belongs to the plan:
# two models on one plan draw on the same connection limit, the same quota, the
# same cooldown and the same learned concurrency. That is not a special case —
# it is the point of the structure.
#
# A model may narrow its plan's connection limit with its own `max_parallel`
# (useful for a slow local model on a shared box), but never widen it.
#
# Lane members are written `plan/model`.
# ============================================================================

settings:
  # A plan expiring within this many days is promoted above plans you keep
  # paying for, soonest death first, so cancelled capacity gets drained.
  drain_within_days: 21
  # How long a session keeps its model. Refreshed on every request, so an
  # active session never migrates; an idle one lets its slot go.
  lease_ttl_seconds: 1800
  # Safety net: an in-flight slot older than this is assumed leaked and pruned.
  inflight_max_age_seconds: 900
  # Default sit-out after a hard quota rejection, when the provider gives us
  # no Retry-After to go on.
  default_cooldown_seconds: 900

  # --------------------------------------------------------------------------
  # Learn the parallelism each plan really tolerates instead of trusting a
  # guess. Halve on a connection-limit refusal, creep back up by one when there
  # is unmet demand and no recent refusal. Bucketed by hour of day, because a
  # provider that allows 6 connections at 04:00 may allow 2 at peak.
  # Learning is per PLAN, since the connection limit belongs to the plan.
  # --------------------------------------------------------------------------
  concurrency_learning:
    enabled: true
    buckets: hour_of_day        # hour_of_day | none
    seed_cap: 2                 # starting guess for `max_parallel: auto`
    min_cap: 1
    decrease_factor: 0.5
    increase_step: 1
    min_samples: 3
    probe_interval_seconds: 300
    probe_cooldown_seconds: 900
    probe_pressure: 3

  # --------------------------------------------------------------------------
  # PACING MODE — off by default. When on, subscriptions are throttled so each
  # lands at ~100% of its allowance right at rollover rather than burning out
  # early and spilling. Quota resets per window, so this is per-window burndown:
  # unused allowance is lost, never carried forward. A cancelled plan's final
  # window is truncated by its expiry, so it paces harder.
  #
  # While on, the tail is disabled and metered providers keep fixed caps.
  # Pacing is per PLAN, because the quota is the plan's.
  # --------------------------------------------------------------------------
  pacing:
    enabled: false
    min_slots: 1
    overshoot: 0.05             # aim 5% hot so we finish at 100%, not 95%
    disable_tail: true
    include_metered: false

# ============================================================================
# PLANS — what you pay for. Credentials, quota, connection limit, cost, expiry.
# ============================================================================
plans:

  # ---------------------------------------------------------- workhorses ----
  minimax-ultra:
    label: "Minimax Ultra Token Plan"
    auth: api_key
    provider_family: minimax
    monthly_cost: 132
    max_parallel: 4               # starting point; the learner adjusts
    max_parallel_ceiling: 6
    api_base: os.environ/MINIMAX_ULTRA_API_BASE
    api_key: os.environ/MINIMAX_ULTRA_API_KEY
    quotas:
      # A token plan is one budget, not a burst window plus an allowance.
      - name: monthly
        role: target
        kind: tokens
        period: month
        allowance: null           # TODO, or let the probe report it
        source: probe
    probe:
      # MiniMax publishes exact headroom here, but the endpoint only answers a
      # browser session — an API key gets "cookie is missing (1004)". Paste the
      # cookie in the portal; see switchyard/probes.py for the caveats.
      kind: cookie
      url: https://api.minimax.io/v1/coding_plan/remains   # TODO: confirm
      method: GET
      window: monthly
      interval_seconds: 600
      referer: https://platform.minimax.io/
      fields:
        remaining: [data.remains, data.remaining_tokens, data.remain, remains]
        total: [data.total, data.total_tokens, data.quota]
        reset_at: [data.reset_at, data.next_reset_time, data.expire_time]
    notes: "Original workhorse. Good at coding with explicit instructions."
    models:
      m2:
        model: openai/MiniMax-M2

  minimax-max:
    label: "Minimax Max Token Plan"
    auth: api_key
    provider_family: minimax
    monthly_cost: 55
    max_parallel: 4
    max_parallel_ceiling: 6
    api_base: os.environ/MINIMAX_MAX_API_BASE
    api_key: os.environ/MINIMAX_MAX_API_KEY
    quotas:
      - name: monthly
        role: target
        kind: tokens
        period: month
        allowance: null
        source: probe
    probe:
      kind: cookie
      url: https://api.minimax.io/v1/coding_plan/remains
      method: GET
      window: monthly
      interval_seconds: 600
      referer: https://platform.minimax.io/
      fields:
        remaining: [data.remains, data.remaining_tokens, data.remain, remains]
        total: [data.total, data.total_tokens, data.quota]
        reset_at: [data.reset_at, data.next_reset_time, data.expire_time]
    notes: "Second workhorse, added 2026-09-20 to stop the OpenRouter burn."
    models:
      m2:
        model: openai/MiniMax-M2

  glm:
    label: "GLM Coding Plan (Z.AI)"
    auth: api_key
    provider_family: zai
    monthly_cost: 0
    max_parallel: auto            # "severely limited" is not a number
    expires: "2026-10-13"
    # A Coding Plan key works ONLY on the coding endpoint. Verified by direct
    # call: coding returns 200, while api.z.ai/api/paas/v4 and
    # open.bigmodel.cn/api/paas/v4 both return 429 code 1113 "insufficient
    # balance". A wrong base URL therefore looks exactly like an exhausted plan
    # — check the URL before believing a GLM quota error.
    api_base: os.environ/GLM_API_BASE
    api_key: os.environ/GLM_API_KEY
    quotas:
      - name: 5h
        role: constraint          # Z.AI enforces a 5-hour prompt window
        kind: tokens
        period: rolling_5h
        allowance: null           # TODO: confirm on the Z.AI plan page
        source: estimate
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null           # TODO: confirm; may be monthly instead
        source: estimate
    notes: "Cancelled. Severely limited — drain whatever is left."
    models:
      glm-4.6:
        model: openai/glm-4.6

  openrouter:
    label: "OpenRouter"
    auth: api_key
    monthly_cost: 0
    metered: true                 # pay-per-token, not a subscription
    max_parallel: 2
    api_key: os.environ/OPENROUTER_API_KEY
    quotas:
      - name: monthly
        role: target
        kind: dollars
        period: month
        allowance: 50             # hard ceiling; alerts at 80%
        source: ledger
    alert_burn_rate_per_hour: 5   # the $20/hr surprise must page us early
    notes: >
      Model-agnostic and the only non-subscription plan. Add models freely —
      they all share the one dollar budget and the one connection limit.
    models:
      mimo:
        model: openrouter/xiaomi/mimo-2.5     # TODO: confirm slug

  opencode-go:
    label: "OpenCode Go Plan"
    # Reached through the OpenCode CLI's own login — a credential the CLI holds,
    # so no API key here. Its own sidecar process because its quota is separate
    # from the Grok plan's, even though both use the same CLI.
    auth: cli_sidecar
    monthly_cost: 0
    max_parallel: auto
    expires: "2026-09-27"
    api_base: http://opencode-go-sidecar:8084/v1
    api_key: sidecar
    quotas:
      - name: monthly
        role: target
        kind: tokens
        period: month
        allowance: null
        source: estimate
    notes: >
      Cancelled, 7 days left as of 2026-09-20. The drain rule puts it at the
      front of the workhorse lane until it dies.
    models:
      # provider/model as OpenCode names it — `opencode` and `opencode-go` are
      # DIFFERENT providers there (free/community versus this paid plan).
      glm-5.3-flash:
        model: openai/opencode-go/glm-5.3-flash

  # ------------------------------------------------------------ judgement ----
  claude-max:
    label: "Claude Max $200"
    auth: cli_sidecar             # OAuth; the Claude CLI holds the credential
    monthly_cost: 200
    max_parallel: 1               # hard: one connection, shared by both models
    max_parallel_ceiling: 1       # never probe above it
    api_base: http://claude-max-sidecar:8081/v1
    api_key: sidecar
    quotas:
      - name: 5h
        role: constraint          # do not blow the burst window
        kind: tokens
        period: rolling_5h
        allowance: null           # TODO: fill after a cycle of observation
        source: sidecar
      - name: weekly
        role: target              # this is the allowance worth filling
        kind: tokens
        period: week
        allowance: null           # TODO
        source: sidecar
    notes: >
      Critical logic only. Both models below share the single connection and the
      quota windows, so apex and judge can never open two connections here.
    models:
      opus:
        model: openai/claude-opus-5
      fable:
        # Fable 5.1 as served by the subscription, not the metered API. Enable
        # once you confirm the CLI accepts this alias:
        #   docker compose exec claude-max-sidecar claude --model bogus 2>&1 | head
        model: openai/claude-fable-5-1
        enabled: false

  openai:
    label: "OpenAI $100 Plan (ChatGPT seat)"
    # A seat has no API key: the Codex CLI owns the OAuth login.
    auth: cli_sidecar
    provider_family: openai
    monthly_cost: 0
    max_parallel: 2
    max_parallel_ceiling: 2       # the seat allows 2; do not probe past it
    expires: "2026-10-04"
    api_base: http://codex-sidecar:8082/v1
    api_key: sidecar
    quotas:
      - name: 5h
        role: constraint
        kind: tokens
        period: rolling_5h
        allowance: null
        source: estimate
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null
        source: estimate
    notes: "Cancelled. Both models share the seat's 2 connections and its quota."
    models:
      # Verified ids on a ChatGPT seat, in capability order — sol strongest, then
      # terra, luna weakest. Prompt overhead for a 5-token reply in brackets.
      # Note the scheme: gpt-5, gpt-5-codex and codex-1 are all rejected.
      sol:
        model: openai/gpt-5.6-sol        # [13293]
      terra:
        model: openai/gpt-5.6-terra      # [13293]
        enabled: false
      luna:
        model: openai/gpt-5.6-luna       # [11728] — weakest; cheap work only
        enabled: false
      astra:
        model: openai/gpt-6-astra        # [14154] — "Astra 6", the apex tier

  grok:
    label: "Grok $300 Plan (SuperGrok)"
    # OAuth-only, reached through OpenCode logged in to xAI. This rides the
    # subscription, on a quota entirely separate from metered api.x.ai credits.
    auth: cli_sidecar
    provider_family: xai
    monthly_cost: 0
    max_parallel: 4
    max_parallel_ceiling: 6
    expires: "2026-10-09"
    api_base: http://grok-sidecar:8083/v1
    api_key: sidecar
    quotas:
      - name: burst
        role: constraint
        kind: tokens
        period: rolling_5h
        allowance: null           # TODO: confirm xAI's burst window size
        source: estimate
      - name: monthly
        role: target
        kind: tokens
        period: month
        allowance: null           # TODO
        source: estimate
    notes: "Cancelled. Better than Minimax, short of Opus. Use it up."
    models:
      grok-4.6:
        model: openai/xai/grok-4.6
      grok-build:
        # Grok Build's coding-agent model; may suit forge better than 4.6.
        model: openai/xai/grok-build-0.1
        enabled: false

  # ---------------------------------------------------------------- local ----
  local-box:
    label: "Local models (this machine)"
    auth: api_key                 # local, but the server still wants a key
    monthly_cost: 0
    # ONE machine, so one connection limit however many models point at it.
    # Three models at 2 each would put six concurrent requests on hardware that
    # handles one or two.
    max_parallel: 2
    api_base: os.environ/LOCAL_API_BASE
    api_key: os.environ/LOCAL_API_KEY
    quotas:
      - name: unlimited
        role: target
        kind: unlimited
        source: none
    notes: "Unmetered. Slow under load — keep parallelism low."
    models:
      qwen:
        label: "Qwen 3.8 Flash Next"
        model: openai/Qwen3.8-Flash-Next-oQ4e-mtp
        context_window: 262144
      gemma:
        label: "Gemma 4 26B"
        model: openai/gemma-4-26B-A4B-it-oQ4e-mtp
        context_window: 262144
      glm-flash:
        label: "GLM 5.3 Flash (1M context)"
        model: openai/GLM-5.3-Flash-oQ4e
        context_window: 1048576
        max_parallel: 1           # narrows the plan's limit for this model
        # Deliberately outside every lane order: it exists as the target for
        # context-window fallbacks, so a prompt too large for the chosen model
        # lands somewhere that can hold it.

  # ------------------------------------------------- metered API (opt-in) ----
  anthropic-api:
    label: "Anthropic API (metered)"
    # A Claude subscription grants no API access; this needs separate billing at
    # console.anthropic.com. Disabled: enable only if you add credits.
    auth: api_key
    enabled: false
    metered: true
    monthly_cost: 0
    max_parallel: 1
    api_key: os.environ/ANTHROPIC_API_KEY
    quotas:
      - name: monthly
        role: target
        kind: dollars
        period: month
        allowance: 100
        source: ledger
    models:
      fable:
        model: anthropic/claude-fable-5-1

# ============================================================================
# LANES — ordered capacity, written as `plan/model`. Requests fill each model's
# plan to its connection limit, then spill to the next.
#
# `tail` is last-resort capacity: it keeps a lane from hard-failing but never
# carries normal traffic, and is excluded from the lane's advertised slots.
# ============================================================================
lanes:

  apex:
    label: "Judgement — Heavy"
    description: >
      Escalations where Opus-class judgement was not enough. Note that both
      members ride plans whose other models serve `judge`, so the connection
      limits are shared — by design.
    order: [openai/astra, claude-max/fable, anthropic-api/fable]
    tail: [claude-max/opus]

  judge:
    label: "Judgement — Regular"
    description: "The normal judgement tier. Most judgement tasks land here."
    order: [claude-max/opus, openai/sol, grok/grok-4.6]
    tail: [local-box/qwen]

  forge:
    label: "Coding Workhorse"
    description: "Getting work done. Ordered fill across every workhorse plan."
    order:
      - minimax-ultra/m2
      - minimax-max/m2
      - grok/grok-4.6
      - glm/glm-4.6
      - opencode-go/glm-5.3-flash
      - openrouter/mimo
    tail: [local-box/qwen]

  local:
    label: "Local Only"
    # No tail and no cloud members on purpose: if the box is busy the caller
    # gets a 429 and backs off rather than silently spending money.
    order: [local-box/qwen, local-box/gemma]
    tail: []

  bulk:
    label: "Basic"
    description: "Mechanical work — summaries, extraction, commit messages."
    order: [local-box/gemma, local-box/qwen]
    tail: [minimax-max/m2]
