# ============================================================================
# Switchyard — single source of truth for plans, capacity, and lanes.
#
# QUOTA WINDOWS. Most subscriptions enforce more than one limit at a time — a
# short burst window (commonly 5 hours) *and* a weekly allowance. Declare them
# all under `quotas:` and mark exactly one `role: target`: the allowance
# pacing tries to fill, which is almost always the weekly one. The others are
# `role: constraint` — limits not to overshoot, but not goals in themselves.
#
# Pacing then spends at the slowest rate any window allows, so the weekly
# allowance gets used up while the 5-hour window is never blown. If you leave
# `role` off entirely, the longest period becomes the target.
# Everything else (routing order, the capacity board, quota headroom, the
# effective $/Mtok table) is derived from this file. Edit here, hit
# POST /admin/reload on the portal; no proxy restart needed.
# ============================================================================

settings:
  # A plan expiring within this many days is promoted above plans you keep
  # paying for, so cancelled capacity gets drained before it dies.
  drain_within_days: 21
  # How long a session keeps its provider. Refreshed on every request, so an
  # active session never migrates; an idle one lets its slot go.
  lease_ttl_seconds: 1800
  # Safety net: an in-flight slot older than this is assumed leaked and pruned.
  inflight_max_age_seconds: 900
  # Default sit-out after a hard quota rejection, when the provider gives us
  # no Retry-After to go on.
  default_cooldown_seconds: 900

  # --------------------------------------------------------------------------
  # Learn the parallelism each provider really tolerates, instead of trusting
  # a guess. Halve the cap when a provider refuses us on connection count,
  # creep back up by one when there is unmet demand and no recent rejection.
  # Learned per hour of day, because a provider that allows 6 connections at
  # 04:00 may allow 2 at peak.
  #
  # Set a plan's `max_parallel: auto` to learn from scratch (starting at
  # seed_cap), or leave a number as the starting point and set
  # `max_parallel_ceiling` to bound how far probing may go.
  # --------------------------------------------------------------------------
  concurrency_learning:
    enabled: true
    buckets: hour_of_day        # hour_of_day | none
    seed_cap: 2                 # starting guess for `max_parallel: auto`
    min_cap: 1                  # never learn our way down to zero
    decrease_factor: 0.5        # multiplicative backoff on a refusal
    increase_step: 1            # additive probe upward
    min_samples: 3              # evidence before trusting an hour bucket
    probe_interval_seconds: 300 # minimum gap between upward probes
    probe_cooldown_seconds: 900 # quiet time needed since the last refusal
    probe_pressure: 3           # denied claims needed before probing up

  # --------------------------------------------------------------------------
  # PACING MODE — off by default. When on, subscriptions are throttled so each
  # one lands at ~100% of its allowance right at rollover, instead of burning
  # out early and spilling. If a caller asks for 10 parallel requests and
  # spending 10 would exhaust Grok days before its window rolls over,
  # Switchyard runs fewer — however few the burndown maths calls for.
  #
  # Quota resets each period, so this is per-window burndown: unused allowance
  # in a window is lost, never carried forward. For a cancelled plan the final
  # window is truncated by the expiry date, so it paces HARDER — same
  # allowance, less time to spend it.
  #
  # While on, the tail is disabled (spilling to a local model would hide that
  # we are ahead of budget) and metered providers keep their fixed caps, since
  # there is no allowance to land on. Per-plan override: `pacing: false`.
  # --------------------------------------------------------------------------
  pacing:
    enabled: false
    min_slots: 1                # never fully close a subscription's lane
    overshoot: 0.05             # aim 5% hot so we finish at 100%, not 95%
    disable_tail: true
    include_metered: false

plans:

  # ---------------------------------------------------------- workhorses ----
  minimax-ultra:
    label: "Minimax Ultra Token Plan"
    deployment: sy.minimax-ultra      # must match config/litellm-config.yaml
    max_parallel: 4             # starting point; the learner adjusts from here
    max_parallel_ceiling: 6
    monthly_cost: 132
    auth: api_key
    provider_family: minimax
    quotas:
      # A token plan is a single budget rather than a burst window plus an
      # allowance, so there is only one window here. Add a `rolling_5h`
      # constraint if MiniMax turns out to throttle within the day.
      - name: monthly
        role: target
        kind: tokens
        period: month
        allowance: null               # TODO, or let the probe report it
        source: probe                 # estimate | headers | probe | ledger
    notes: "Original workhorse. Good at coding with explicit instructions."
    # MiniMax publishes exact Token Plan headroom at /coding_plan/remains, but
    # that endpoint only answers a browser session — an API key gets
    # "cookie is missing (1004)". Paste the session cookie once in the portal
    # (Subscriptions -> "real usage") and this polls it for real numbers.
    # A cookie is full account access; see switchyard/probes.py for the caveats.
    probe:
      kind: cookie
      url: https://api.minimax.io/v1/coding_plan/remains   # TODO: confirm host/path
      method: GET
      window: monthly
      interval_seconds: 600
      referer: https://platform.minimax.io/
      # Candidate field paths; run the probe once and the portal prints the raw
      # response so you can correct these.
      fields:
        remaining: [data.remains, data.remaining_tokens, data.remain, remains]
        total: [data.total, data.total_tokens, data.quota]
        reset_at: [data.reset_at, data.next_reset_time, data.expire_time]


  minimax-max:
    label: "Minimax Max Token Plan"
    deployment: sy.minimax-max
    max_parallel: 4
    max_parallel_ceiling: 6
    monthly_cost: 55
    auth: api_key
    provider_family: minimax
    quotas:
      - name: monthly
        role: target
        kind: tokens
        period: month
        allowance: null               # TODO, or let the probe report it
        source: probe
    notes: "Second workhorse, added 2026-09-20 to stop the OpenRouter burn."
    # MiniMax publishes exact Token Plan headroom at /coding_plan/remains, but
    # that endpoint only answers a browser session — an API key gets
    # "cookie is missing (1004)". Paste the session cookie once in the portal
    # (Subscriptions -> "real usage") and this polls it for real numbers.
    # A cookie is full account access; see switchyard/probes.py for the caveats.
    probe:
      kind: cookie
      url: https://api.minimax.io/v1/coding_plan/remains   # TODO: confirm host/path
      method: GET
      window: monthly
      interval_seconds: 600
      referer: https://platform.minimax.io/
      # Candidate field paths; run the probe once and the portal prints the raw
      # response so you can correct these.
      fields:
        remaining: [data.remains, data.remaining_tokens, data.remain, remains]
        total: [data.total, data.total_tokens, data.quota]
        reset_at: [data.reset_at, data.next_reset_time, data.expire_time]


  glm:
    label: "GLM Coding Plan"
    deployment: sy.glm
    max_parallel: auto                # "severely limited" — learn the real number
    monthly_cost: 0
    auth: api_key
    provider_family: zai
    expires: "2026-10-13"
    quotas:
      - name: 5h
        role: constraint              # Z.AI enforces a 5-hour prompt window
        kind: tokens
        period: rolling_5h
        allowance: null               # TODO: confirm on the Z.AI plan page
        source: estimate
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null               # TODO: confirm; may be monthly instead
        source: estimate
    notes: "Cancelled. Severely limited — drain whatever is left."

  openrouter-mimo:
    label: "OpenRouter (Mimo 2.5)"
    deployment: sy.openrouter-mimo
    max_parallel: 2
    monthly_cost: 0
    auth: api_key
    metered: true                     # pay-per-token, not a subscription
    quota:
      kind: dollars
      period: month
      allowance: 50                   # hard ceiling; alerts at 80%
      source: ledger                  # we know exactly what we spent
    alert_burn_rate_per_hour: 5       # the $20/hr surprise must page us early
    notes: "Overflow only. Decent as a workhorse but it is real money."

  opencode-go:
    label: "OpenCode Go Plan"
    deployment: sy.opencode-go
    max_parallel: auto                # unknown limit — learn it from scratch
    monthly_cost: 0
    auth: api_key
    expires: "2026-09-27"
    quota:
      kind: window
      period: month
      allowance: null
      source: estimate
    notes: >
      Cancelled, 7 days left as of 2026-09-20. Severely limited, so cap 1 —
      but the drain rule puts it at the FRONT of the forge lane until it dies.

  # ------------------------------------------------------------ judgement ----
  claude-max:
    label: "Claude Max $200"
    deployment: sy.claude-max
    max_parallel: 1                   # hard: one connection
    max_parallel_ceiling: 1           # never probe above it
    monthly_cost: 200
    auth: oauth_sidecar               # see sidecars/claude-max
    quotas:
      - name: 5h
        role: constraint              # do not blow the burst window
        kind: tokens
        period: rolling_5h
        allowance: null               # TODO: fill from a cycle of observation
        source: sidecar               # the CLI reports the reset time
      - name: weekly
        role: target                  # this is the allowance worth filling
        kind: tokens
        period: week
        allowance: null               # TODO
        source: sidecar
    notes: >
      Critical logic only. Heaviest non-Paperclip use is interactive, so the
      5-hour window is the one that bites; weekly is what we pace to fill.

  anthropic-fable:
    label: "Fable 5.1 (Anthropic API)"
    deployment: sy.anthropic-fable
    max_parallel: 1
    monthly_cost: 0
    auth: api_key
    metered: true
    quota:
      kind: dollars
      period: month
      allowance: 100
      source: ledger
    notes: "Escalation tier. Metered — keep the ceiling tight."

  astra:
    label: "Astra 6"
    deployment: sy.astra
    max_parallel: 1
    monthly_cost: 0
    auth: api_key
    enabled: false                    # flip on once the endpoint is confirmed
    quota: {kind: unknown, source: estimate}

  openai:
    label: "OpenAI $100 Plan (seat)"
    deployment: sy.openai
    max_parallel: 2
    max_parallel_ceiling: 2           # the plan allows 2; do not probe past it
    monthly_cost: 0
    auth: oauth_sidecar               # a ChatGPT seat: OAuth only, no API key
    provider_family: openai
    expires: "2026-10-04"
    quotas:
      - name: 5h
        role: constraint
        kind: tokens
        period: rolling_5h
        allowance: null               # TODO
        source: estimate
      - name: weekly
        role: target
        kind: tokens
        period: week
        allowance: null               # TODO
        source: estimate
    notes: "Cancelled. Weekly allowance already spent this week — expect 429s."

  grok:
    label: "Grok $300 Plan"
    deployment: sy.grok
    max_parallel: 4
    max_parallel_ceiling: 6
    monthly_cost: 0
    auth: api_key
    expires: "2026-10-09"
    quotas:
      - name: burst
        role: constraint
        kind: tokens
        period: rolling_5h
        allowance: null               # TODO: confirm xAI's burst window size
        source: estimate
      - name: monthly
        role: target
        kind: tokens
        period: month
        allowance: null               # TODO
        source: estimate
    notes: "Cancelled. Better than Minimax, short of Opus. Use it up."

  # ---------------------------------------------------------------- local ----
  qwen-local:
    label: "Qwen 3.8 Flash (local)"
    deployment: sy.qwen-local
    max_parallel: 2
    monthly_cost: 0
    auth: none
    quota: {kind: unlimited, source: none}
    notes: "Just under Opus quality. Slow under load — keep parallelism low."

  gemma-local:
    label: "Gemma 4 (local)"
    deployment: sy.gemma-local
    max_parallel: 2
    monthly_cost: 0
    auth: none
    quota: {kind: unlimited, source: none}
    notes: "Cheap and fast. Summaries, extraction, classification."

# ============================================================================
# LANES — ordered capacity. Requests fill each plan to its cap, then spill to
# the next. `tail: true` means the plan is last-resort only: it exists so the
# lane never hard-fails, not as a lane that runs all the time.
# ============================================================================
lanes:

  apex:
    label: "Judgement — Heavy"
    description: "Escalations where Opus-class judgement was not enough."
    order: [anthropic-fable, astra]
    tail: [claude-max]

  judge:
    label: "Judgement — Regular"
    description: "The normal judgement tier. Most judgement tasks land here."
    order: [claude-max, openai, grok]
    tail: [qwen-local]

  forge:
    label: "Coding Workhorse"
    description: "Getting work done. Ordered fill across every workhorse plan."
    order: [minimax-ultra, minimax-max, grok, glm, opencode-go, openrouter-mimo]
    tail: [qwen-local]

  local:
    label: "Local Only"
    # No tail and no cloud members on purpose: if the box is busy the caller
    # gets a 429 and backs off rather than silently spending money.
    order: [qwen-local, gemma-local]
    tail: []

  bulk:
    label: "Basic"
    description: "Mechanical work — summaries, extraction, commit messages."
    order: [gemma-local, qwen-local]
    tail: [minimax-max]

# ============================================================================
# TRANSPORT — how each plan is actually reached. Kept in the same file as the
# plan registry so credentials, caps, cost and lane order never drift apart.
# `model_name` in the generated LiteLLM config is each plan's `deployment`.
#
# OAuth-only subscriptions (auth: oauth_sidecar) point at a localhost sidecar
# that owns the vendor CLI and its token refresh. LiteLLM itself does no OAuth
# and never sees a subscription credential.
# ============================================================================
deployments:

  minimax-ultra:
    model: openai/MiniMax-M2
    api_base: os.environ/MINIMAX_ULTRA_API_BASE
    api_key: os.environ/MINIMAX_ULTRA_API_KEY

  minimax-max:
    model: openai/MiniMax-M2
    api_base: os.environ/MINIMAX_MAX_API_BASE
    api_key: os.environ/MINIMAX_MAX_API_KEY

  glm:
    # A GLM Coding Plan key MUST use the coding endpoint; the general endpoint
    # rejects it. https://api.z.ai/api/coding/paas/v4 (not open.bigmodel.cn,
    # which is the mainland general-API host).
    model: openai/glm-4.6
    api_base: os.environ/GLM_API_BASE
    api_key: os.environ/GLM_API_KEY

  openrouter-mimo:
    model: openrouter/xiaomi/mimo-2.5     # TODO: confirm slug on openrouter.ai/models
    api_key: os.environ/OPENROUTER_API_KEY

  claude-max:
    model: openai/claude-opus-5           # served by the sidecar, OpenAI-shaped
    api_base: http://claude-max-sidecar:8081/v1
    api_key: sidecar

  anthropic-fable:
    model: anthropic/claude-fable-5-1
    api_key: os.environ/ANTHROPIC_API_KEY

  astra:
    model: openai/astra-6                 # TODO: confirm provider route
    api_base: os.environ/ASTRA_API_BASE
    api_key: os.environ/ASTRA_API_KEY

  openai:
    # Seat-based plan: the Codex CLI owns the OAuth login, the sidecar exposes
    # it as HTTP. Concurrency is whatever the sidecar allows (2 here).
    model: openai/gpt-5
    api_base: http://codex-sidecar:8082/v1
    api_key: sidecar

  grok:
    model: xai/grok-4
    api_key: os.environ/XAI_API_KEY

  opencode-go:
    model: openai/grok-code           # TODO: confirm model id + base URL
    api_base: os.environ/OPENCODE_API_BASE
    api_key: os.environ/OPENCODE_API_KEY

  qwen-local:
    model: openai/qwen-3.8-flash
    api_base: os.environ/LOCAL_API_BASE
    api_key: local

  gemma-local:
    model: openai/gemma-4
    api_base: os.environ/LOCAL_API_BASE
    api_key: local
