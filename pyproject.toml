# SwitchYard project config.
#
# Two stanzas are meaningful here:
#   * [tool.ruff] is the project linter (issue #136). Selects the rule set we
#     actually enforce -- a mechanical F/B/W605/C901 sweep -- and excludes
#     `secrets/`, which holds a vendored CLI cache with its own failing
#     suite.
#   * [tool.pytest.ini_options] is the test runner config. Issue #136 also
#     moves pytest config off pytest.ini so the two cannot drift; delete
#     pytest.ini in the same commit or the ini file silently wins.
[tool.ruff]
# Python 3.12 is what the runtime images pin; matching here keeps ruff from
# flagging PEP 695 type-parameter syntax it can't parse, and keeps the gate green
# even if the developer's host has a different interpreter.
target-version = "py312"
# Vendored CLI state (Codex plugin cache ships its own failing suite) and any
# build output. Matches the norecursedirs list under pytest so neither tool
# trips over it.
extend-exclude = ["secrets"]

[tool.ruff.lint]
# E9: runtime errors (syntax, undefined name); F: pyflakes; B: bugbear; W605:
# invalid escape sequence (the docstring-on-a-regex class of bug); C901: a
# function is too complex -- used here so a single hot path doesn't quietly
# grow past the point of being reviewable, not as a refactoring driver.
select = ["E9", "F", "B", "W605", "C901"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing F401 / F841 / B905 noise in files that are NOT touched by this
# lint-greening PR (issue #136). Each one is a real defect -- the imports are
# unused, the locals never read, the zip lengths could diverge -- but the fix
# for them is the broader refactor that lives in issue #138. Deferring here
# keeps the gate green today without smuggling the cleanup in under a
# different name.
"switchyard/drain.py" = ["F401"]
"switchyard/portal/app.py" = ["F401", "F841"]
"switchyard/probes.py" = ["F401"]
"switchyard/selfcheck.py" = ["F401"]
"switchyard/usage.py" = ["B905"]

[tool.ruff.lint.mccabe]
# The MAX_COMPLEXITY ceiling sits above the natural branching density of the
# sidecars' protocol code -- a sidecar is a state machine on top of a wire
# format, and pushing it below ~25 forces artificial helper extraction that
# hurts more than it helps. Where a function genuinely exceeds this, mark it
# explicitly with a `# noqa: C901` (and a reason); issue #138 owns the deeper
# refactor.
max-complexity = 25

[tool.pytest.ini_options]
# Only our own tests; the vendored secrets/ tree has a failing suite of its own
# and must not be collected. Keep these in sync with the [tool.ruff]
# `extend-exclude` above.
testpaths = ["tests"]
norecursedirs = ["secrets", ".git", ".venv", "node_modules"]