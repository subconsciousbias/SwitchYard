# Per-workspace disposable Docker containers via the global orca-tasks
# scaffold (~/.local/share/orca-tasks). The scripts live OUTSIDE the repo on
# purpose — do not copy them in. Panes render natively with this recipe.
environmentRecipes:
  - id: docker-task
    name: DTC
    create: ~/.local/share/orca-tasks/recipe-create.sh
    destroy: ~/.local/share/orca-tasks/recipe-destroy.sh
  - id: docker-task-auto
    name: DTC (auto-trigger)
    create: ~/.local/share/orca-tasks/recipe-create-auto-trigger.sh
    destroy: ~/.local/share/orca-tasks/recipe-destroy.sh
