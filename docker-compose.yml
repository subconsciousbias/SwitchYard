# Switchyard — `docker compose up -d` brings up the whole thing.
#
#   gateway  :4000  OpenAI- and Anthropic-compatible. Point every tool here.
#   portal   :4001  capacity board, quota headroom, subscription economics.
#   sidecars :8081  Claude Max   (claude -p)      internal only
#            :8082  OpenAI seat  (codex exec)     internal only
#            :8083  SuperGrok    (opencode run)   internal only
#            :8084  OpenCode Go  (opencode run)   internal only
#
# The sidecars exist because those three plans are OAuth subscriptions with no
# API key. Each reads its own connection limit and model aliases from
# config/plans.yaml, so limits are never duplicated here.
#
# Local models are expected on the host; LOCAL_API_BASE defaults to
# host.docker.internal so Ollama/LM Studio work without extra config.

name: switchyard

x-common: &common
  restart: unless-stopped
  env_file: [.env]

services:

  redis:
    image: redis:7-alpine
    <<: *common
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    <<: *common
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: {context: ., dockerfile: Dockerfile.gateway}
    <<: *common
    ports: ["${GATEWAY_PORT:-4000}:4000"]
    volumes:
      # /switchyard, not /app: /app is LiteLLM's own application directory.
      - ./config:/switchyard/config:ro
    environment:
      SWITCHYARD_PLANS: /switchyard/config/plans.yaml
      SWITCHYARD_REDIS_URL: redis://redis:6379/1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@postgres:5432/litellm
      LOCAL_API_BASE: ${LOCAL_API_BASE:-http://host.docker.internal:11434/v1}
      # Reaches the container via env_file too, but named here so the
      # dependency is visible when the local lane 401s.
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-2}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  portal:
    build: {context: ., dockerfile: Dockerfile.portal}
    <<: *common
    ports: ["${PORTAL_PORT:-4001}:4001"]
    volumes:
      - ./config:/app/config:ro
    environment:
      SWITCHYARD_REDIS_URL: redis://redis:6379/1
    depends_on:
      redis: {condition: service_healthy}

  # Claude Max's quota is OAuth-only, so the CLI owns the credential and this
  # service just exposes it as HTTP on the internal network.
  #
  # Credentials live in ./secrets/claude, NOT your host ~/.claude — on macOS the
  # host token is in the Keychain and unreadable here anyway, and mounting your
  # live config directory read-write lets a containerised CLI rewrite the config
  # of the CLI you are using interactively. See secrets/README.md.
  #   docker compose exec claude-max-sidecar claude login
  # The four sidecars are the SAME image; only their environment differs. Only
  # this service declares `build`, and the rest reference the tag it produces —
  # otherwise compose builds the identical image four times and writes four tags,
  # which wastes build time and (with concurrent exports) can fail with
  # "image already exists".
  claude-max-sidecar:
    build: {context: ., dockerfile: Dockerfile.sidecar}
    image: switchyard-sidecar:latest
    <<: *common
    expose: ["8081"]
    # Concurrency and model aliases come from config/plans.yaml — the plans
    # sharing `subscription: claude-max`. Nothing about limits is set here, so
    # there is only ever one number to change.
    environment:
      PROVIDER: claude
      # The inverted MCP bridge: a caller's tools are exposed to Claude Code as
      # MCP tools, and the call is parked and handed back rather than executed
      # here. Claude Max cannot be reached over the API under its terms, so this
      # is the only route to tool calling on that subscription.
      BRIDGE: mcp
      SIDECAR_PORT: "8081"
      SWITCHYARD_PLAN: claude-max
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Verified present on this CLI version: --system-prompt overrides the
      # built-in agent prompt instead of stacking on it, and replace mode also
      # passes --exclude-dynamic-system-prompt-sections. Set to `append` if you
      # downgrade the CLI to a version without those flags.
      SYSTEM_MODE: replace
    volumes:
      - ./config:/app/config:ro
      - ${CLAUDE_CONFIG_DIR:-./secrets/claude}:/home/node/.claude
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  codex-sidecar:
    image: switchyard-sidecar:latest     # built by claude-max-sidecar
    <<: *common
    expose: ["8082"]
    # Serves both the `openai` seat (gpt-5) and `astra` (GPT 6) — one seat, one
    # set of connections. Limits come from plans.yaml.
    # Log in with: docker compose exec codex-sidecar codex login
    # Expires 2026-10-04 — delete this service and both plans then.
    environment:
      PROVIDER: codex
      SIDECAR_PORT: "8082"
      SWITCHYARD_PLAN: openai
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CODEX_HOME: /home/node/.codex
      CLI_EXTRA_ARGS: ${CODEX_EXTRA_ARGS:-}
    volumes:
      - ./config:/app/config:ro
      - ${CODEX_CONFIG_DIR:-./secrets/codex}:/home/node/.codex
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # SuperGrok via Switchyard's own OAuth grant, not the OpenCode CLI. This is
  # the path that lets a caller's `tools` reach the model untouched, because
  # there is no agent harness in the way — see sidecars/token_proxy/server.py.
  # Needs a grant first, from the host: python3 -m switchyard.oauth login xai
  xai-token-proxy:
    build: {context: ., dockerfile: Dockerfile.token_proxy}
    image: switchyard-token-proxy:latest
    <<: *common
    expose: ["8090"]
    environment:
      SWITCHYARD_PROVIDER: xai
      PROXY_PORT: "8090"
      SWITCHYARD_PLAN: grok
      SWITCHYARD_PLANS: /app/config/plans.yaml
    volumes:
      - ./config:/app/config:ro
      # Read-write: the proxy refreshes the access token and writes it back, so
      # the host CLI and every container share one current grant. Nothing else
      # in ./secrets is readable from here.
      - ./secrets:/app/secrets
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The OpenCode Go plan: same CLI, different login, SEPARATE quota — so it gets
  # its own process. One process per subscription is what keeps the connection
  # gates independent.
  # Expires 2026-09-27 — delete this service and the plan then.
  opencode-go-sidecar:
    image: switchyard-sidecar:latest     # built by claude-max-sidecar
    <<: *common
    expose: ["8084"]
    environment:
      PROVIDER: opencode
      # Verified against a live `opencode run` (v1.18.31): --dir project config
      # loads a local MCP server, its tools arrive as switchyard_<name>, no
      # permission prompt blocks them, and a 90s parked call survives now that
      # tool_server.py sends notifications/progress.
      BRIDGE: mcp
      SIDECAR_PORT: "8084"
      SWITCHYARD_PLAN: opencode-go
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CLI_EXTRA_ARGS: ${OPENCODE_EXTRA_ARGS:-}
    volumes:
      - ./config:/app/config:ro
      - ${OPENCODE_DATA_DIR:-./secrets/opencode/data}:/home/node/.local/share/opencode
      - ${OPENCODE_CONFIG_DIR:-./secrets/opencode/config}:/home/node/.config/opencode
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8084/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
  pg-data:
