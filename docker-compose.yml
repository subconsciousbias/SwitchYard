# Switchyard — `docker compose up -d` brings up the whole thing.
#
#   gateway  :4000  OpenAI- and Anthropic-compatible. Point every tool here.
#   portal   :4001  capacity board, quota headroom, subscription economics.
#   sidecars :8081  Claude Max   (claude -p)      internal only
#            :8082  OpenAI seat  (codex exec)     internal only
#            :8083  SuperGrok    (opencode run)   internal only
#            :8084  OpenCode Go  (opencode run)   internal only
#
# The sidecars exist because those three plans are OAuth subscriptions with no
# API key. Each reads its own connection limit and model aliases from
# config/plans.yaml, so limits are never duplicated here.
#
# Local models are expected on the host; LOCAL_API_BASE defaults to
# host.docker.internal so Ollama/LM Studio work without extra config.

name: switchyard

x-common: &common
  restart: unless-stopped
  env_file: [.env]

services:

  redis:
    image: redis:7-alpine
    <<: *common
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    <<: *common
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: {context: ., dockerfile: Dockerfile.gateway}
    <<: *common
    ports: ["${GATEWAY_PORT:-4000}:4000"]
    volumes:
      - ./config:/app/config:ro
    environment:
      SWITCHYARD_REDIS_URL: redis://redis:6379/1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@postgres:5432/litellm
      LOCAL_API_BASE: ${LOCAL_API_BASE:-http://host.docker.internal:11434/v1}
      # Reaches the container via env_file too, but named here so the
      # dependency is visible when the local lane 401s.
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-2}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  portal:
    build: {context: ., dockerfile: Dockerfile.portal}
    <<: *common
    ports: ["${PORTAL_PORT:-4001}:4001"]
    volumes:
      - ./config:/app/config:ro
    environment:
      SWITCHYARD_REDIS_URL: redis://redis:6379/1
    depends_on:
      redis: {condition: service_healthy}

  # Claude Max's quota is OAuth-only, so the CLI owns the credential and this
  # service just exposes it as HTTP on the internal network. Log in once with
  # `docker compose exec claude-max-sidecar claude login`, or mount a host
  # ~/.claude that is already logged in.
  claude-max-sidecar:
    build: {context: ., dockerfile: Dockerfile.sidecar}
    <<: *common
    expose: ["8081"]
    # Concurrency and model aliases come from config/plans.yaml — the plans
    # sharing `subscription: claude-max`. Nothing about limits is set here, so
    # there is only ever one number to change.
    environment:
      PROVIDER: claude
      SIDECAR_PORT: "8081"
      SWITCHYARD_SUBSCRIPTION: claude-max
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Verified present on this CLI version: --system-prompt overrides the
      # built-in agent prompt instead of stacking on it, and replace mode also
      # passes --exclude-dynamic-system-prompt-sections. Set to `append` if you
      # downgrade the CLI to a version without those flags.
      SYSTEM_MODE: replace
    volumes:
      - ./config:/app/config:ro
      - ${CLAUDE_CONFIG_DIR:-~/.claude}:/home/node/.claude
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  codex-sidecar:
    build: {context: ., dockerfile: Dockerfile.sidecar}
    <<: *common
    expose: ["8082"]
    # Serves both the `openai` seat (gpt-5) and `astra` (GPT 6) — one seat, one
    # set of connections. Limits come from plans.yaml.
    # Log in with: docker compose exec codex-sidecar codex login
    # Expires 2026-10-04 — delete this service and both plans then.
    environment:
      PROVIDER: codex
      SIDECAR_PORT: "8082"
      SWITCHYARD_SUBSCRIPTION: openai
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CODEX_HOME: /home/node/.codex
      CLI_EXTRA_ARGS: ${CODEX_EXTRA_ARGS:-}
    volumes:
      - ./config:/app/config:ro
      - ${CODEX_CONFIG_DIR:-~/.codex}:/home/node/.codex
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # SuperGrok is OAuth-only and rides xAI's CLI proxy on its own quota, separate
  # from metered api.x.ai credits. Reached through OpenCode logged in to xAI.
  # Log in with: docker compose exec grok-sidecar opencode auth login
  # Expires 2026-10-09 — delete this service and the plan then.
  grok-sidecar:
    build: {context: ., dockerfile: Dockerfile.sidecar}
    <<: *common
    expose: ["8083"]
    environment:
      PROVIDER: opencode
      SIDECAR_PORT: "8083"
      SWITCHYARD_SUBSCRIPTION: grok
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CLI_EXTRA_ARGS: ${OPENCODE_EXTRA_ARGS:-}
    volumes:
      - ./config:/app/config:ro
      - ${OPENCODE_DATA_DIR:-~/.local/share/opencode}:/home/node/.local/share/opencode
      - ${OPENCODE_CONFIG_DIR:-~/.config/opencode}:/home/node/.config/opencode
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8083/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The OpenCode Go plan: same CLI, different login, SEPARATE quota — so it gets
  # its own process. One process per subscription is what keeps the connection
  # gates independent.
  # Expires 2026-09-27 — delete this service and the plan then.
  opencode-go-sidecar:
    build: {context: ., dockerfile: Dockerfile.sidecar}
    <<: *common
    expose: ["8084"]
    environment:
      PROVIDER: opencode
      SIDECAR_PORT: "8084"
      SWITCHYARD_SUBSCRIPTION: opencode-go
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CLI_EXTRA_ARGS: ${OPENCODE_EXTRA_ARGS:-}
    volumes:
      - ./config:/app/config:ro
      - ${OPENCODE_DATA_DIR:-~/.local/share/opencode}:/home/node/.local/share/opencode
      - ${OPENCODE_CONFIG_DIR:-~/.config/opencode}:/home/node/.config/opencode
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8084/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
  pg-data:
