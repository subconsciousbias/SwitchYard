# SwitchYard — `docker compose up -d` brings up the whole thing.
#
#   gateway  :4000  OpenAI- and Anthropic-compatible. Point every tool here.
#   portal   :4001  capacity board, quota headroom, subscription economics.
#   sidecars :8081  Claude Max   (claude -p)      internal only
#            :8082  OpenAI seat  (codex exec)     internal only
#            :8084  OpenCode Go  (opencode run)   internal only
#            :8085  OpenCode Go 2 (opencode run)  internal only
#   proxy    :8090  SuperGrok    (own OAuth grant) internal only
#
# The sidecars exist because those plans are OAuth subscriptions with no API
# key. Each reads its own connection limit and model aliases from
# config/plans.yaml, so limits are never duplicated here. SuperGrok needs no
# CLI: api.x.ai is OpenAI-compatible, so the token proxy attaches our own
# OAuth bearer and forwards the caller's request untouched.
#
# Local models are expected on the host; LOCAL_API_BASE defaults to
# host.docker.internal so Ollama/LM Studio work without extra config.

# The project name is sourced from the operator's .env, not hardcoded —
# every worktree has its own ./config/ but addresses the same compose project
# by name, so a worktree that hardcodes `name: switchyard` would build and
# recreate the LIVE containers from branch code. Fail closed instead: a
# missing SWITCHYARD_PROJECT errors out at compose parse time. The main
# checkout's .env (synced by scripts/sync-env.sh from .env.example) sets it
# to `switchyard`; worktrees have no .env (gitignored) so they fail.
name: ${SWITCHYARD_PROJECT:?run compose from the main checkout — see CLAUDE.md}

x-common: &common
  restart: unless-stopped
  # Issue #131: every sidecar / token-proxy must get SIGTERM through uvicorn
  # directly (PID 1, set via `exec uvicorn` in the Dockerfile CMDs). Two
  # pieces back this up at the compose layer:
  #
  #   * `init: true` makes docker compose attach a tiny PID-1 (tini).
  #     Useful on its own: tini reaps zombie children, which matters for
  #     the cli_bridge image where the inner vendor CLIs (claude, codex,
  #     opencode) spawn subprocesses of their own and exit without
  #     wait()-ing. It is NOT a backstop for a regression that drops the
  #     Dockerfile's `exec uvicorn` -- tini forwards SIGTERM to its
  #     IMMEDIATE child only. With `init: true` AND a sh-as-PID-1
  #     regression, tini -> sh -> uvicorn, and the SIGTERM dies with sh;
  #     uvicorn never sees it. The Dockerfile tests
  #     (test_dockerfile_sidecar_uses_exec_uvicorn_with_graceful_shutdown_bound
  #     and the token-proxy twin) are what catch that regression. Cost:
  #     ~250 KiB, no other side effect.
  #   * `stop_grace_period: 45s` is the upper bound docker compose gives the
  #     container to exit after SIGTERM. It is set deliberately to exceed
  #     uvicorn's `--timeout-graceful-shutdown 30` (see Dockerfile.sidecar /
  #     Dockerfile.token_proxy) by enough margin to cover the mcp_bridge
  #     shutdown drain (reaper cancellation + cleanup of every live session's
  #     parked futures, turns and CLI subprocesses), but well under the
  #     apply.sh drain grace window so a stuck sidecar never holds up a
  #     drain past its budget.
  init: true
  stop_grace_period: 45s

services:

  redis:
    image: redis:7-alpine
    <<: *common
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    <<: *common
    environment:
      POSTGRES_USER: litellm
      # Fail-closed on unset: the previous `${POSTGRES_PASSWORD:-litellm}` let
      # the database boot with the LiteLLM-image default password, which is
      # published on Docker Hub and lets anyone reach the DB on the network.
      # The main checkout's .env always sets this (scripts/sync-env.sh appends
      # it), so the only operators who hit `:?missing` are the ones who
      # genuinely forgot to run sync-env.sh — and they need to know.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing - run scripts/sync-env.sh and set a value}
      POSTGRES_DB: litellm
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: {context: ., dockerfile: Dockerfile.gateway}
    <<: *common
    # Loopback by default: the gateway speaks OpenAI/Anthropic over plain HTTP,
    # and `LITELLM_MASTER_KEY` is the only authentication. A bare
    # `"${GATEWAY_PORT:-4000}:4000"` would bind 0.0.0.0 and expose the master
    # key to every host on the network — that's the failure mode issue #118
    # documents. Set `BIND_ADDR=0.0.0.0` to expose intentionally; the loopback
    # default is what keeps a fresh `docker compose up -d` from being
    # reachable from the LAN/VPS/café Wi-Fi. See SECURITY.md's "trust
    # boundary" section.
    ports: ["${BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-4000}:4000"]
    volumes:
      # /switchyard, not /app: /app is LiteLLM's own application directory.
      - ./config:/switchyard/config:ro
    environment:
      SWITCHYARD_PLANS: /switchyard/config/plans.yaml
      SWITCHYARD_REDIS_URL: redis://redis:6379/1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?missing - run scripts/sync-env.sh and set a value}@postgres:5432/litellm
      LOCAL_API_BASE: ${LOCAL_API_BASE:-http://host.docker.internal:11434/v1}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-2}
      # The only service that legitimately holds secrets: every key listed in
      # config/plans.yaml's `os.environ/NAME` references. Named explicitly so a
      # lane 401 names the missing variable instead of failing silently.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?missing}
      MINIMAX_ULTRA_API_BASE: ${MINIMAX_ULTRA_API_BASE:-}
      MINIMAX_ULTRA_API_KEY: ${MINIMAX_ULTRA_API_KEY:-}
      MINIMAX_MAX_API_BASE: ${MINIMAX_MAX_API_BASE:-}
      MINIMAX_MAX_API_KEY: ${MINIMAX_MAX_API_KEY:-}
      GLM_API_BASE: ${GLM_API_BASE:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  portal:
    build: {context: ., dockerfile: Dockerfile.portal}
    <<: *common
    # Same loopback-by-default rationale as the gateway above. The portal has
    # no authentication at all — anyone reaching :4001 can read your quota
    # headroom and monthly spend. Override BIND_ADDR in .env to expose.
    ports: ["${BIND_ADDR:-127.0.0.1}:${PORTAL_PORT:-4001}:4001"]
    volumes:
      - ./config:/app/config:ro
    environment:
      SWITCHYARD_REDIS_URL: redis://redis:6379/1
      # Probe code in switchyard/portal/app.py reads os.environ/OPENCODE_ORG_ID
      # and os.environ/OPENCODE_ORG_ID2 from plans.yaml; one per Go subscription.
      OPENCODE_ORG_ID: ${OPENCODE_ORG_ID:-}
      OPENCODE_ORG_ID2: ${OPENCODE_ORG_ID2:-}
      # Probe code reads os.environ/GLM_API_KEY from the glm plan's
      # probe.headers.Authorization in plans.yaml.
      GLM_API_KEY: ${GLM_API_KEY:-}
    depends_on:
      redis: {condition: service_healthy}

  # Claude Max's quota is OAuth-only, so the CLI owns the credential and this
  # service just exposes it as HTTP on the internal network.
  #
  # Credentials live in ./secrets/claude, NOT your host ~/.claude — on macOS the
  # host token is in the Keychain and unreadable here anyway, and mounting your
  # live config directory read-write lets a containerised CLI rewrite the config
  # of the CLI you are using interactively. On Linux the token lives in the
  # user's keyring (GNOME Keyring / KWallet via secret-tool) and on Windows it
  # sits in Windows Credential Manager (DPAPI-encrypted) — none of those are
  # reachable from the container. See secrets/README.md.
  #   docker compose exec claude-max-sidecar claude login
  # The sidecars are the SAME image; only their environment differs. Only
  # this service declares `build`, and the rest reference the tag it produces —
  # otherwise compose builds the identical image four times and writes four tags,
  # which wastes build time and (with concurrent exports) can fail with
  # "image already exists".
  claude-max-sidecar:
    build: {context: ., dockerfile: Dockerfile.sidecar}
    image: switchyard-sidecar:latest
    <<: *common
    user: node
    cap_drop: [ALL]
    expose: ["8081"]
    # Concurrency and model aliases come from config/plans.yaml — the plans
    # sharing `subscription: claude-max`. Nothing about limits is set here, so
    # there is only ever one number to change.
    environment:
      PROVIDER: claude
      # The inverted MCP bridge: a caller's tools are exposed to Claude Code as
      # MCP tools, and the call is parked and handed back rather than executed
      # here. Claude Max cannot be reached over the API under its terms, so this
      # is the only route to tool calling on that subscription.
      BRIDGE: mcp
      SIDECAR_PORT: "8081"
      SWITCHYARD_PLAN: claude-max
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Verified present on this CLI version: --system-prompt overrides the
      # built-in agent prompt instead of stacking on it, and replace mode also
      # passes --exclude-dynamic-system-prompt-sections. Set to `append` if you
      # downgrade the CLI to a version without those flags.
      SYSTEM_MODE: replace
    volumes:
      - ./config:/app/config:ro
      - ${CLAUDE_CONFIG_DIR:-./secrets/claude}:/home/node/.claude
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  codex-sidecar:
    image: switchyard-sidecar:latest     # built by claude-max-sidecar
    <<: *common
    user: node
    cap_drop: [ALL]
    expose: ["8082"]
    # Serves both the `openai` seat (gpt-5) and `astra` (GPT 6) — one seat, one
    # set of connections. Limits come from plans.yaml.
    # Log in with: docker compose exec codex-sidecar codex login
    # Expires 2026-10-04 — delete this service and both plans then.
    environment:
      PROVIDER: codex
      # Codex has an MCP client after all (`[mcp_servers.*]`, settable with -c),
      # verified against a live `codex exec` on the seat: the tool is called and
      # a 90s parked call completes. So the seat serves tools through its own
      # official client, with no need for chatgpt.com's private responses route.
      BRIDGE: mcp
      SIDECAR_PORT: "8082"
      SWITCHYARD_PLAN: openai
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CODEX_HOME: /home/node/.codex
      CLI_EXTRA_ARGS: ${CODEX_EXTRA_ARGS:-}
    volumes:
      - ./config:/app/config:ro
      - ${CODEX_CONFIG_DIR:-./secrets/codex}:/home/node/.codex
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # SuperGrok via SwitchYard's own OAuth grant, not the OpenCode CLI. This is
  # the path that lets a caller's `tools` reach the model untouched, because
  # there is no agent harness in the way — see sidecars/token_proxy/server.py.
  # Needs a grant first, from the host: python3 -m switchyard.oauth login xai
  xai-token-proxy:
    build: {context: ., dockerfile: Dockerfile.token_proxy}
    image: switchyard-token-proxy:latest
    <<: *common
    expose: ["8090"]
    environment:
      SWITCHYARD_PROVIDER: xai
      PROXY_PORT: "8090"
      # Mirrored from PROXY_PORT so the drain loop's
      # `scripts/health_idle.py` probe (apply.sh step 4) can reach
      # /health on the same port the compose healthcheck uses. Without
      # this, the probe takes the empty-port `unknown` path; with it,
      # the doc's lack of `in_flight` is what classifies it `unknown`.
      SIDECAR_PORT: "8090"
      SWITCHYARD_PLAN: grok
      SWITCHYARD_PLANS: /app/config/plans.yaml
    volumes:
      - ./config:/app/config:ro
      # Read-write: the proxy refreshes the access token and writes it back, so
      # the host CLI and the container share one current grant. The mount is
      # scoped to ./secrets/xai, not the whole ./secrets tree — the Claude,
      # Codex and OpenCode credential stores (mounted separately on their own
      # sidecars above) are NOT visible here.
      - ./secrets/xai:/app/secrets
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The OpenCode Go plan: same CLI, different login, SEPARATE quota — so it gets
  # its own process. One process per subscription is what keeps the connection
  # gates independent.
  # Expires 2026-09-27 — delete this service and the plan then.
  opencode-go-sidecar:
    image: switchyard-sidecar:latest     # built by claude-max-sidecar
    <<: *common
    user: node
    cap_drop: [ALL]
    expose: ["8084"]
    environment:
      PROVIDER: opencode
      # Verified against a live `opencode run` (v1.18.31): --dir project config
      # loads a local MCP server, its tools arrive as switchyard_<name>, no
      # permission prompt blocks them, and a 90s parked call survives now that
      # tool_server.py sends notifications/progress.
      BRIDGE: mcp
      SIDECAR_PORT: "8084"
      SWITCHYARD_PLAN: opencode-go
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CLI_EXTRA_ARGS: ${OPENCODE_EXTRA_ARGS:-}
    volumes:
      - ./config:/app/config:ro
      - ${OPENCODE_DATA_DIR:-./secrets/opencode/data}:/home/node/.local/share/opencode
      - ${OPENCODE_CONFIG_DIR:-./secrets/opencode/config}:/home/node/.config/opencode
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8084/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Second OpenCode Go subscription: same CLI, ANOTHER login, separate quota —
  # so its own process, like every other subscription. Two plans must never
  # share a sidecar: the process serves exactly one plan (SWITCHYARD_PLAN) with
  # exactly one CLI login, and pointing the second plan at the first's process
  # would spend the first account's quota under the second plan's name.
  opencode-go2-sidecar:
    image: switchyard-sidecar:latest     # built by claude-max-sidecar
    <<: *common
    user: node
    cap_drop: [ALL]
    expose: ["8085"]
    environment:
      PROVIDER: opencode
      BRIDGE: mcp
      SIDECAR_PORT: "8085"
      SWITCHYARD_PLAN: opencode-go2
      SWITCHYARD_PLANS: /app/config/plans.yaml
      CLI_EXTRA_ARGS: ${OPENCODE_EXTRA_ARGS:-}
    volumes:
      - ./config:/app/config:ro
      - ${OPENCODE2_DATA_DIR:-./secrets/opencode2/data}:/home/node/.local/share/opencode
      - ${OPENCODE2_CONFIG_DIR:-./secrets/opencode2/config}:/home/node/.config/opencode
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8085/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
  pg-data:
