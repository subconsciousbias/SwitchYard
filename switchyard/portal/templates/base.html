<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwitchYard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#f7f7f5; --panel:#fff; --ink:#1b1b19; --muted:#6b6b66; --line:#e3e3de;
    --ok:#2f7d5d; --warn:#b07a10; --bad:#b3402f; --accent:#3a5f9e; --track:#ececea;
    /* A slot held by a *different* lane: occupied, but not this lane's traffic.
       Deliberately not warn/bad, which mean something is wrong. */
    --elsewhere:#7c6aa8;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#161714; --panel:#1e201c; --ink:#eceae4; --muted:#9a9a92; --line:#2e312c;
    --ok:#6cc39a; --warn:#e0b25c; --bad:#e58873; --accent:#8fb0e8; --track:#2a2d28;
    --elsewhere:#b3a3e0;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
     margin:32px 0 10px;font-weight:600}
  .sub{color:var(--muted);margin:0 0 4px}
  /* overflow-x, not `width` tricks: the plans table is full of nowrap mono
     numbers whose combined minimum is wider than any fixed max-width, and a
     table that cannot shrink pushes PAST the window. Scrolling inside the
     panel keeps every column intact and the page honest. */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:14px 16px;overflow-x:auto}
  .grid{display:grid;gap:12px}
  @media(min-width:780px){.grid.lanes{grid-template-columns:repeat(2,1fr)}}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
     color:var(--muted);font-weight:600;padding:0 8px 8px;border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  .bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;min-width:90px}
  .bar>i{display:block;height:100%;background:var(--ok)}
  .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
  .slots{display:flex;gap:3px;flex-wrap:wrap}
  .slot{width:11px;height:16px;border-radius:2px;background:var(--track);
        border:1px solid var(--line)}
  .slot.used{background:var(--accent);border-color:transparent}
  /* Busy on another lane: same model, someone else's request. */
  .slot.elsewhere{background:var(--elsewhere);border-color:transparent}
  /* Busy on a sibling model of the same plan, which shares its connections. */
  .slot.sibling{background:var(--track);border-color:var(--elsewhere);
                border-style:dashed}
  /* Above the configured max_parallel: the learner probed here, which only
     happens when max_parallel_ceiling permits it. */
  .slot.probed{border-color:var(--warn);border-style:dotted}
  /* The plan has no quota left. Expressed as a RED OUTLINE, never as a fill:
     a slot that is both spent and in use must still read as in use, and an
     earlier version painted the hatch over the blue so a live request looked
     idle. The hatch marks only the slots that are free and unusable. */
  .slot.spent{border-color:var(--bad);border-style:solid}
  .slot.spent:not(.used){background:repeating-linear-gradient(45deg,transparent,
                         transparent 2px,var(--bad) 2px,var(--bad) 3px)}
  .slot.used.spent{background:var(--accent);box-shadow:inset 0 0 0 1px var(--bad)}
  .slot.probed.used{background:var(--accent);border-style:solid;
                    box-shadow:inset 0 0 0 1px var(--warn)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;
          font-size:11px;color:var(--muted);margin-top:8px}
  .legend .slot{width:9px;height:12px}
  .legend span.k{display:inline-flex;align-items:center;gap:4px}
  /* Withheld capacity. The stripes used to be drawn in --track over the panel
     background -- two near-identical colours -- so it read as an ordinary empty
     slot. Muted stripes and a dashed border make it legible without competing
     with the red of a spent plan. */
  .slot.gone{border-style:dashed;border-color:var(--muted);
             background:repeating-linear-gradient(45deg,transparent,transparent 2px,
                        var(--muted) 2px,var(--muted) 3px);opacity:.75}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
       border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .tag.bad{color:var(--bad);border-color:currentColor}
  .tag.warn{color:var(--warn);border-color:currentColor}
  .tag.ok{color:var(--ok);border-color:currentColor}
  /* An actual button, not a tag chip: bigger, with a cursor and a hover, and a
     pressed fill so the on/off distinction reads at a glance. Used by the
     pacing toggle; aria-pressed is the source of truth, the colour follows. */
  .toggle{font:inherit;font-size:13px;line-height:1;padding:7px 14px;
          border-radius:6px;cursor:pointer;background:var(--panel);color:var(--ink);
          border:1px solid var(--line);
          transition:background-color .15s,border-color .15s,color .15s}
  .toggle:hover{border-color:var(--ink)}
  .toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toggle[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
  .big{font-size:26px;font-weight:600;letter-spacing:-.02em}
  .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .muted{color:var(--muted)} .nowrap{white-space:nowrap}
  .lane-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .spark{display:flex;gap:2px;align-items:flex-end;height:22px}
  .spark>i{width:5px;background:var(--accent);opacity:.55;border-radius:1px;min-height:1px}
  footer{margin-top:40px;color:var(--muted);font-size:12px}
</style>
</head>
<body><div class="wrap">{% block body %}{% endblock %}</div></body>
</html>
